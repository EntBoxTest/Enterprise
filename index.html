<!doctype html>
<html lang="en">
<head><meta name="eios-src" content="sample">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CRM</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   TENANT CRM — visual system (production pass, 2026-09-23)

   Built on the Entbox design system and the EIOS palette the AgentBox
   dashboard uses. Decisions are measured, not tasted:

   CONTRAST. Every text tone clears WCAG AA on EVERY surface it can sit on,
   including the raised one: text 14.4:1, secondary 8.0:1, tertiary 5.6:1
   (was 4.3:1 -- a fail on cards). Data colours are marks, never text.

   HIERARCHY. Weight and tone do the work, not size and colour. One type
   scale -- 11 / 12 / 13 / 14 / 20 / 28 -- and three weights: 500 for body
   emphasis, 600 for titles, 700 for the figures that lead a card. DM Sans
   for anything that names or counts; IBM Plex Sans for anything read as
   prose. Big figures use proportional numerals; columns use tabular.

   RHYTHM. A 4px base, 8px step: 8 / 12 / 16 / 24 / 32. Rows are 40px.
   Spacing lives on containers as gap, not on children as margins.

   ELEVATION. On a dark ground depth is a lighter surface, not a shadow.
   The frame (rails) is darkest, the canvas one step up, raised elements
   (table header, inputs) one more, hover one more. Cards are outline-first
   per the brand: the line is the card, the canvas shows through.

   No edge of any card is coloured. Severity is a pill or a swatch beside
   its label; state is a label; magnitude is a bar.

   ⚠️ :root token NAMES are a contract with supervisor/tenant_config.py
   (THEME_TOKENS) and applyBrand()/applyTheme(). Names stay; values are ours.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#3446FF;
  --accent-rgb:52,70,255;
  --on-accent:#ffffff;
  /* elevation: frame, canvas, raised, hover */
  --bg:#070A1F;
  --bg2:#0E1333;
  --surface:#131A42;
  --surface2:#182052;
  --surface3:#1C2255;
  --border:#242B5A;
  --border2:#3B4590;
  /* ink: 14.4 / 8.0 / 5.6 to 1 on the raised surface */
  --text:#EAEDFF;
  --text-dim:#A9B1DE;
  --text-faint:#8A93C4;
  --green:#57C77E;
  --amber:#E9C56E;
  --red:#FF5A6E;
  --blue:#7B8FFF;
  --violet:#B9C4FF;
  --radius:0px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fh:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* lines are felt, not drawn */
  --line-soft:rgba(123,143,255,.10);
  --line:rgba(123,143,255,.20);
  --line-strong:rgba(123,143,255,.42);
  /* boundaries that carry meaning -- controls, markers -- sit at 3:1 on the
     canvas (measured); derived from the accent so a tenant theme follows */
  --line-ui:color-mix(in srgb, var(--blue) 60%, transparent);
  --tint-soft:rgba(123,143,255,.06);
  --tint:rgba(123,143,255,.12);
  --focus:0 0 0 2px var(--bg2),0 0 0 4px var(--blue);
  /* the scale */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  /* the type scale */
  /* TYPE. One scale for a dense UI, a step of roughly 1.125 at the small end
     (Stripe-dense, Linear-restrained): 11 12 13 14 16 18 20 28 36. Each size
     has a role; nothing renders off the scale. Leading by role: figures 1.05,
     titles 1.2, table cells 1.4, UI text 1.45, reading prose 1.55. */
  --t-xs:11px;--t-meta:12px;--t-sm:12px;--t-body:13px;--t-md:14px;--t-lg:16px;--t-xl:18px;--t-title:20px;--t-fig:28px;--t-hero:36px;
  --lh-fig:1.05;--lh-head:1.2;--lh-table:1.4;--lh-ui:1.45;--lh-prose:1.55;
  --row:40px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg2);color:var(--text);
  font-family:var(--sans);font-size:var(--t-md);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface2);border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}
:focus-visible{outline:none;box-shadow:var(--focus)}
button,input{font-family:inherit}

/* figures and identifiers: DM Sans, tabular in columns */
.mono{font-family:var(--fh);font-weight:500;font-size:var(--t-sm);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--text-faint)}
.muted{color:var(--text-dim)}
/* the eyebrow: every small label in the system */
/* the small label: sentence case, never shouted. Weight and tone carry it. */
.eyebrow,.k-label,.pk-unit,.brand-sub,thead th,.tbl th,.dq-action b,.mx-th,.sec-eyebrow{
  font-family:var(--fh);font-weight:500;font-size:var(--t-sm);letter-spacing:0;text-transform:none;color:var(--text-faint)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sideW,240px) minmax(0,1fr);height:100vh;overflow:hidden}
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;min-width:0}
/* the sidebar's width is the operator's: drag its edge (160-420px, kept per
   browser), double-click to reset. The handle straddles the border so it is
   easy to catch, and shows an accent line only while hovered or dragging. */
.side-resize{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:5;touch-action:none}
.side-resize::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--accent);opacity:0;transition:opacity .15s}
.side-resize:hover::after,.side-resize.is-dragging::after{opacity:1}
.side-resize:focus-visible{outline:none}.side-resize:focus-visible::after{opacity:1}
.shell.is-resizing,.shell.is-resizing *{cursor:col-resize !important;user-select:none}
.brand-name,.brand-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ── rows open a record ─────────────────────────────────────────────────
   A row is a link to its record: pointer, a hover tint (already there), and a
   focus ring for the keyboard. The record opens in a drawer over the page. */
tbody tr.rlink{cursor:pointer}
tbody tr.rlink:focus-visible td{background:var(--tint)}
tbody tr.rlink:focus-visible{outline:none}
tbody tr.rlink:focus-visible td:first-child{box-shadow:inset 2px 0 0 var(--blue)}
tbody tr.is-open td{background:var(--tint)}
.avi{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:var(--s2);vertical-align:middle;
  font-family:var(--fh);font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--text);background:var(--tint);border:1px solid var(--line-strong)}
.cell-name{display:inline-flex;align-items:center}
.rel{cursor:help;text-decoration:underline dotted transparent;transition:text-decoration-color .15s}
tbody tr:hover .rel{text-decoration-color:var(--line-strong)}
td a.cell-link{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-strong);transition:border-color .15s,color .15s}
td a.cell-link:hover{border-bottom-color:var(--blue);color:var(--text)}

/* ── the record drawer ──────────────────────────────────────────────────
   A panel from the right over the page the row lives on; the list stays in
   view behind a light scrim. Header names the record; the body is field
   groups, then the related records already in the file, then a timeline of
   the dates the record carries. Slides on the widget's ease; reduced motion
   snaps. */
.dr-scrim{position:fixed;inset:0;background:rgba(4,6,20,.62);z-index:69;opacity:0;pointer-events:none;transition:opacity .28s ease}
.dr-scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:70;display:flex;flex-direction:column;
  background:var(--bg2);border-left:1px solid var(--line-strong);transform:translateX(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.drawer.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer:focus{outline:none;box-shadow:none}
.dr-head{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);flex:0 0 auto}
.dr-head .avi{width:36px;height:36px;font-size:13px;margin:0;flex:0 0 auto}
.dr-who{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:4px}
.dr-title{margin:0;font-family:var(--fh);font-size:var(--t-title);font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--text);overflow-wrap:anywhere}
.dr-sub{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:var(--t-sm);color:var(--text-faint)}
.dr-actions{display:flex;align-items:center;gap:var(--s1);flex:0 0 auto}
.dr-btn{height:30px;min-width:30px;padding:0 var(--s2);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;border:1px solid transparent;border-radius:0;color:var(--text-dim);cursor:pointer;
  font-family:var(--fh);font-size:var(--t-sm);font-weight:500;transition:color .15s,background-color .15s,border-color .15s}
.dr-btn:hover{color:var(--text);background:var(--tint-soft);border-color:var(--line)}
.dr-btn svg{width:15px;height:15px}
.dr-body{flex:1 1 auto;overflow:auto;min-height:0;padding:var(--s4) var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
.dr-sec{display:flex;flex-direction:column;gap:var(--s3)}
.dr-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.dr-sec-h h3{margin:0;font-family:var(--fh);font-size:var(--t-sm);font-weight:500;color:var(--text-faint)}
.dr-sec-h .dr-more{font-family:var(--fh);font-size:var(--t-sm);font-weight:500;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
.dr-sec-h .dr-more:hover{color:var(--text)}
.dr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--s4)}
.dr-f{min-width:0;display:flex;flex-direction:column;gap:2px}
.dr-f.wide{grid-column:1 / -1}
.dr-k{font-family:var(--fh);font-size:var(--t-meta);font-weight:500;color:var(--text-faint)}
.dr-v{font-size:var(--t-body);color:var(--text);overflow-wrap:anywhere}
.dr-v.num{font-family:var(--fh);font-weight:500}
.dr-v a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--line-ui)}
.dr-v a:hover{color:var(--text);border-bottom-color:var(--blue)}
.dr-v .dim{color:var(--text-faint)}
.rel-list{display:flex;flex-direction:column;border:1px solid var(--line)}
.rel-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--line-soft);background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0;color:inherit;text-align:left;cursor:pointer;font:inherit;transition:background-color .15s}
.rel-row:last-child{border-bottom:0}
.rel-row:hover{background:var(--tint-soft)}
.rel-row:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--blue)}
.rel-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.rel-t{font-weight:600;color:var(--text);font-size:var(--t-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-s{font-size:var(--t-meta);color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-when{font-family:var(--fh);font-size:var(--t-sm);font-weight:500;color:var(--text-faint);white-space:nowrap}
.rel-empty{padding:var(--s3);font-size:var(--t-sm);color:var(--text-faint)}
.tl{display:flex;flex-direction:column;position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line-strong)}
.tl-i{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;padding:var(--s2) 0}
.tl-i::before{content:"";position:absolute;left:-16px;top:13px;width:7px;height:7px;background:var(--bg2);border:1px solid var(--line-ui)}
.tl-i.now::before{background:var(--blue);border-color:var(--blue)}
.tl-t{font-size:var(--t-body);color:var(--text)}
.tl-t .dim{color:var(--text-faint)}
.tl-d{font-family:var(--fh);font-size:var(--t-sm);font-weight:500;color:var(--text-faint);white-space:nowrap}
.dr-note{font-size:var(--t-sm);color:var(--text-faint);line-height:1.5}
@media (prefers-reduced-motion:reduce){.drawer,.drawer.on,.dr-scrim{transition:none}}
.brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);height:64px;border-bottom:1px solid var(--line)}
.mark{
  width:32px;height:32px;border-radius:0;flex:0 0 auto;
  background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:15px;
}
.brand-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.brand-name{font-family:var(--fh);font-weight:600;font-size:var(--t-md);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:var(--t-sm)}
nav{padding:var(--s3) var(--s3);display:flex;flex-direction:column;gap:2px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:var(--s3);height:var(--row);padding:0 var(--s3);border-radius:0;
  color:var(--text-dim);cursor:pointer;user-select:none;font-size:var(--t-body);font-weight:500;
  border:1px solid transparent;background:none;width:100%;text-align:left;
  transition:background-color .15s,color .15s,border-color .15s;
}
.nav-item:hover{background:var(--tint-soft);color:var(--text)}
.nav-item.active{background:var(--surface);color:var(--text);border-color:var(--line)}
.nav-item svg{display:none}
.nav-badge{
  margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:0;
  background:var(--tint);color:var(--text);border:1px solid var(--line);
  font-family:var(--fh);font-size:var(--t-meta);font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.side-foot{margin-top:auto;padding:var(--s4);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s1);
  font-size:var(--t-sm);color:var(--text-faint);line-height:1.5}
.side-foot .row{display:flex;align-items:center;gap:var(--s2);color:var(--text-dim);font-weight:500}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg2)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s5);
  height:64px;padding:0 var(--s6);border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto;
}
.topbar > div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.topbar h1{margin:0;font-family:var(--fh);font-size:var(--t-title);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.topbar .sub{font-size:var(--t-sm);color:var(--text-faint);line-height:1.3}
.top-meta{display:flex;align-items:center;gap:var(--s4);font-size:var(--t-sm);color:var(--text-faint);white-space:nowrap}
.chip-live{display:inline-flex;align-items:center;height:26px;padding:0 var(--s3);border-radius:0;
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  font-family:var(--fh);font-size:var(--t-sm);font-weight:500}
/* the canvas: a centred measure so lines do not sprawl on a wide display */
.content{overflow:auto;min-height:0;padding:var(--s5) var(--s6) var(--s7)}
.content > .page{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}

/* ---------- sections ---------- */
.sec{display:flex;flex-direction:column;gap:var(--s4)}
.sec-h{display:flex;align-items:baseline;gap:var(--s3);min-height:20px}
.sec-h h2{margin:0;font-family:var(--fh);font-size:var(--t-md);font-weight:600;letter-spacing:-.005em;color:var(--text)}
.sec-h .hint{margin-left:auto;font-size:var(--t-sm);color:var(--text-faint);text-align:right}

/* ---------- cards ---------- */
.card{background:transparent;border:1px solid var(--line);border-radius:var(--radius);transition:border-color .2s}
.card-h{height:48px;padding:0 var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.card-h h2{margin:0;font-family:var(--fh);font-size:var(--t-body);font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .hint{font-size:var(--t-sm);color:var(--text-faint);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-gap{display:none}

/* KPI: label / value / context. Proportional figures at display size. */
/* KPIs: one strip, figures divided by hairlines -- not four identical boxes.
   The divider is the 1px gap showing the container's line colour through, so
   it is correct however the grid wraps (a row on a desk, a column on a phone)
   and never becomes a stripe down one side of anything. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s2);border:0;background:var(--bg2)}
.k-value{font-family:var(--fh);font-size:var(--t-fig);font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--text);font-variant-numeric:normal}
.k-value-sm{font-size:22px}
.k-value.ok{color:var(--text)}
.k-sub{font-size:var(--t-sm);color:var(--text-dim);line-height:1.45}
/* ── KPI context ─────────────────────────────────────────────────────────
   One hero figure, three supporting. Every figure that has dates behind it
   carries a delta against the prior period and a sparkline of the last
   twelve months, computed from the file itself; a figure with no history
   (active share) carries a proportion bar instead of a made-up trend. Marks
   are thin and square; colour is not used for direction. */
@media (min-width:1080px){.kpis{grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr))}}
.kpi.hero .k-value{font-size:36px}
.k-delta{display:flex;align-items:baseline;gap:var(--s2);font-family:var(--fh);font-size:var(--t-sm);font-weight:500;color:var(--text-dim);flex-wrap:wrap}
.k-delta b{font-weight:600;color:var(--text)}
.k-delta .k-dir{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;vertical-align:1px;margin-right:2px}
.k-delta .k-dir.up{border-bottom:5px solid var(--text-dim)}
.k-delta .k-dir.down{border-top:5px solid var(--text-dim)}
.k-spark{margin-top:auto;padding-top:var(--s2)}
.k-spark svg{display:block;width:100%;height:36px;overflow:visible}
.k-spark polyline{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:square;vector-effect:non-scaling-stroke}
.k-spark rect.pt{fill:var(--blue)}
.k-spark line.base{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.k-spark-l{display:flex;justify-content:space-between;font-family:var(--fh);font-size:var(--t-meta);color:var(--text-faint);margin-top:var(--s1)}
.k-bar{margin-top:auto;padding-top:var(--s2)}
.k-bar .bar-track{height:6px;background:var(--border)}
.k-bar .bar-fill{height:6px;background:var(--blue)}
@media (max-width:1079px){.kpi.hero{grid-column:1 / -1}}

.grid-2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.grid-2 > div{display:flex;flex-direction:column;gap:var(--s4)}
@media (max-width:1080px){.grid-2{grid-template-columns:minmax(0,1fr)}}

/* ---------- bar lists: thin marks, the track a lighter step of the hue ---------- */
.chart{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.bar-row{display:grid;grid-template-columns:minmax(96px,132px) minmax(0,1fr) 56px 88px;align-items:center;gap:var(--s3);min-height:20px}
.bar-name{font-size:var(--t-body);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:6px;border-radius:0;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:0;background:var(--accent);min-width:2px;transition:width .35s ease}
.bar-num{font-family:var(--fh);font-weight:600;font-size:var(--t-body);text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.bar-money{font-family:var(--fh);font-weight:500;font-size:var(--t-sm);text-align:right;font-variant-numeric:tabular-nums;color:var(--text-faint)}
@media (max-width:640px){.bar-row{grid-template-columns:88px minmax(0,1fr) 48px}.bar-money{display:none}}
.qrow{display:grid;grid-template-columns:minmax(120px,148px) minmax(0,1fr) 48px;align-items:center;gap:var(--s3);min-height:22px}
.qrow .bar-track{height:6px}

/* ---------- pills: state as a label ---------- */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 var(--s2);border-radius:0;
  font-family:var(--fh);font-size:var(--t-sm);font-weight:500;letter-spacing:0;text-transform:none;
  border:1px solid transparent;white-space:nowrap;line-height:1}
.p-green{color:var(--green);background:rgba(87,199,126,.10);border-color:rgba(87,199,126,.3)}
.p-amber{color:var(--amber);background:rgba(233,197,110,.10);border-color:rgba(233,197,110,.3)}
.p-red{color:var(--red);background:rgba(255,90,110,.10);border-color:rgba(255,90,110,.32)}
.p-blue{color:var(--blue);background:rgba(123,143,255,.10);border-color:rgba(123,143,255,.32)}
.p-violet{color:var(--violet);background:rgba(185,196,255,.08);border-color:rgba(185,196,255,.28)}
.p-gray{color:var(--text-dim);background:var(--tint-soft);border-color:var(--line)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-height:56px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
.search{position:relative;flex:0 1 300px;min-width:200px}
.search svg{position:absolute;left:var(--s3);top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);pointer-events:none}
.search input{border-color:var(--line-strong) !important;
  width:100%;height:36px;padding:0 40px 0 36px;border-radius:4px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:var(--t-body);outline:none;transition:border-color .15s,box-shadow .15s;
}
.search input::placeholder{color:var(--text-faint)}
.search input:focus{border-color:var(--blue)}
.kbd{position:absolute;right:var(--s3);top:50%;transform:translateY(-50%);height:18px;min-width:18px;display:grid;place-items:center;
  font-family:var(--fh);font-weight:500;font-size:var(--t-meta);color:var(--text-faint);border:1px solid var(--line);padding:0 5px;pointer-events:none}
.filters{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;flex:1 1 320px;min-width:0}
.fbtn{
  height:32px;padding:0 var(--s3);border-radius:0;border:1px solid var(--line-strong);background:transparent;
  color:var(--text-dim);font-size:var(--t-sm);font-weight:500;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,background-color .15s;
}
.fbtn:hover{border-color:var(--line-ui);color:var(--text)}
.fbtn.on{background:var(--tint);border-color:var(--line-ui);color:var(--text)}
.fbtn .ct{font-family:var(--fh);font-weight:600;color:var(--text-faint);margin-left:0;font-variant-numeric:tabular-nums}
.fbtn.on .ct{color:var(--text-dim)}
.tool-right{margin-left:auto;flex:0 0 auto;font-family:var(--fh);font-weight:500;font-size:var(--t-sm);color:var(--text-faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- table: 40px rows, sticky header, right-aligned numbers ---------- */
/* The table scrolls INSIDE its card, both ways, and the page stays put: the
   header is frozen at the top and the first column (the identifier) at the
   left, so a row keeps its name however far right you read. Ten columns do
   not fit 1,134px honestly; crushing them would cost more than a scrollbar.
   Sized to the viewport so the pager stays in reach below. */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:240px;scrollbar-gutter:stable}
thead th:first-child,tbody td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
tbody td:first-child{background:var(--bg2)}
tbody tr:hover td:first-child{background:var(--surface)}
thead th:first-child{z-index:3}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--t-body)}
thead th{
  position:sticky;top:0;z-index:2;text-align:left;height:36px;padding:0 var(--s3);background:var(--surface);
  border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;
}
thead th.sortable{cursor:pointer;transition:color .15s,background-color .15s}
thead th.sortable:hover{color:var(--text);background:var(--surface2)}
thead th.ta-r{text-align:right}
th .arrow{opacity:0;margin-left:5px;font-size:8px;vertical-align:1px}
th.sorted{color:var(--text)}
th.sorted .arrow{opacity:1;color:var(--blue)}
tbody td{height:var(--row);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap;color:var(--text-dim);line-height:1.35}
tbody tr:hover td{background:var(--tint-soft)}
tbody tr:last-child td{border-bottom:0}
td.ta-r{text-align:right}
td.num{font-family:var(--fh);font-weight:500;color:var(--text)}
.cell-strong{font-weight:600;color:var(--text)}
.cell-2{font-size:var(--t-sm);color:var(--text-faint);margin-top:2px}
.cell-2.mono{font-size:var(--t-meta)}
.subj{max-width:360px;overflow:hidden;text-overflow:ellipsis;display:block}
.flag{color:var(--red);font-family:var(--fh);font-weight:600;font-size:var(--t-sm)}
.na{color:var(--text-faint);font-weight:500}
.empty-row td{height:auto;padding:var(--s7) var(--s4);text-align:center;color:var(--text-faint)}
/* a designed empty state: what happened, what to try, one action */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s2);max-width:420px;margin:0 auto}
.empty-t{font-family:var(--fh);font-size:var(--t-md);font-weight:600;color:var(--text)}
.empty-s{font-size:var(--t-sm);color:var(--text-faint);line-height:1.5}
.empty .fbtn{margin-top:var(--s2)}

/* ── filters as selects, for the long lists (plan, city) ── */
.fsel-w{position:relative;display:inline-flex}
.fsel-w::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--text-faint);border-bottom:1.5px solid var(--text-faint);transform:rotate(45deg);pointer-events:none}
.fsel{appearance:none;-webkit-appearance:none;height:32px;padding:0 30px 0 var(--s3);border-radius:0;border:1px solid var(--line-strong);background:transparent;
  color:var(--text-dim);font-family:inherit;font-size:var(--t-sm);font-weight:500;cursor:pointer;max-width:200px;text-overflow:ellipsis;transition:border-color .15s,color .15s}
.fsel:hover{border-color:var(--line-ui);color:var(--text)}
.fsel.on{background:var(--tint);border-color:var(--line-ui);color:var(--text)}
.fsel option{background:var(--bg);color:var(--text)}
.fgroup{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}

/* ── the View control: which columns, how dense ── */
.tool-right{display:flex;align-items:center;gap:var(--s3)}
.vwrap{position:relative}
.vbtn{height:32px;padding:0 var(--s3);border-radius:0;border:1px solid var(--line-strong);background:transparent;color:var(--text-dim);
  font-family:var(--fh);font-size:var(--t-sm);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,background-color .15s}
.vbtn svg{width:14px;height:14px}
.vbtn:hover,.vbtn[aria-expanded=true]{border-color:var(--line-ui);color:var(--text);background:var(--tint-soft)}
.vpop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:236px;background:var(--bg2);border:1px solid var(--line-strong);padding:var(--s3);
  display:flex;flex-direction:column;gap:var(--s3)}
.vpop[hidden]{display:none}    /* display:flex above would otherwise beat the attribute */
.vpop h4{margin:0;font-family:var(--fh);font-size:var(--t-meta);font-weight:500;color:var(--text-faint)}
.vlist{display:flex;flex-direction:column}
.vopt{display:flex;align-items:center;gap:var(--s2);height:28px;font-size:var(--t-sm);color:var(--text-dim);cursor:pointer;user-select:none}
.vopt:hover{color:var(--text)}
.vopt input{accent-color:var(--accent);width:14px;height:14px;margin:0;flex:0 0 auto}
.vopt input:disabled + span{color:var(--text-faint)}
.vseg{display:flex;border:1px solid var(--line)}
.vseg button{flex:1 1 0;height:28px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--text-dim);
  font-family:var(--fh);font-size:var(--t-meta);font-weight:500;cursor:pointer;transition:background-color .15s,color .15s}
.vseg button:last-child{border-right:0}
.vseg button:hover{color:var(--text)}
.vseg button.on{background:var(--tint);color:var(--text)}
.vreset{align-self:flex-start;background:none;border:0;padding:0;font-family:var(--fh);font-size:var(--t-meta);font-weight:500;color:var(--blue);cursor:pointer}
.vreset:hover{color:var(--text)}
/* density: the row height token, set on the table's wrapper */
.tbl-wrap[data-rows=compact]{--row:34px}
.tbl-wrap[data-rows=compact] tbody td{padding-top:var(--s1);padding-bottom:var(--s1)}
.tbl-wrap[data-rows=compact] .cell-2{display:none}
.tbl-wrap[data-rows=compact] .avi{width:20px;height:20px;font-size:9px}
.tbl-wrap[data-rows=relaxed]{--row:52px}
.tbl-wrap[data-rows=relaxed] tbody td{padding-top:var(--s3);padding-bottom:var(--s3)}
/* sortable headers take the keyboard */
thead th.sortable:focus-visible{color:var(--text);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--blue)}

/* ── loading: the shell's shape, quietly pulsing, until the file arrives ── */
.skel{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh;overflow:hidden}
.skel-side{background:var(--bg);border-right:1px solid var(--line);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.skel-main{padding:var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
.skel-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid var(--line);background:var(--line)}
.skel-row > div{background:var(--bg2);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.sk{background:var(--surface);animation:skp 1.6s ease-in-out infinite}
.sk.w1{width:40%;height:10px}.sk.w2{width:60%;height:28px}.sk.w3{width:80%;height:10px}.sk.nav{height:36px;width:100%}.sk.card{height:220px;width:100%}
@keyframes skp{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (max-width:780px){.skel{grid-template-columns:minmax(0,1fr)}.skel-side{display:none}.skel-row{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* ---------- pager ---------- */
.pager{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:var(--s2) var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
.pager .info{font-size:var(--t-sm);color:var(--text-faint);font-variant-numeric:tabular-nums}
.pgs{display:flex;align-items:center;gap:var(--s1);margin-left:auto;flex-wrap:wrap}
.pg{
  min-width:32px;height:32px;padding:0 var(--s2);border-radius:0;border:1px solid var(--line-strong);
  background:transparent;color:var(--text-dim);font-family:var(--fh);font-weight:500;font-size:var(--t-sm);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:border-color .15s,color .15s;
}
.pg:hover:not(:disabled){color:var(--text);border-color:var(--line-ui)}
.pg:disabled{opacity:.35;cursor:default}
.pg.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.pg-gap{color:var(--text-faint);padding:0 2px}

/* ---------- data quality ---------- */
.dq-banner{display:flex;gap:var(--s4);padding:var(--s5);border-radius:var(--radius);background:transparent;border:1px solid var(--line)}
.dq-banner > div{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.dq-banner .ico{width:20px;height:20px;color:var(--amber);display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.dq-banner .ico svg{width:18px;height:18px}
.dq-banner h2{margin:0;font-family:var(--fh);font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--text);line-height:1.3}
.dq-banner p{margin:0;font-size:var(--t-md);color:var(--text-dim);max-width:72ch;line-height:1.6}
.dq-banner .note{margin:0;font-size:var(--t-sm);color:var(--text-faint)}
.p-scope{margin:0;font-size:var(--t-sm);color:var(--text-faint);font-variant-numeric:tabular-nums}
.p-warn{color:var(--amber,#e0a458)}
.dq-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.dq-stat{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s2);border:0;background:var(--bg2)}
.dq-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--s4)}
.dq-card{padding:var(--s4) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.dq-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.dq-id{font-family:var(--fh);font-size:var(--t-meta);font-weight:500;letter-spacing:.02em;color:var(--text-faint)}
.dq-count{display:flex;align-items:baseline;gap:var(--s2)}
.dq-count b{font-family:var(--fh);font-size:var(--t-fig);font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--text)}
.dq-count span{font-size:var(--t-sm);color:var(--text-faint)}
.dq-title{font-family:var(--fh);font-size:var(--t-md);font-weight:600;letter-spacing:-.005em;margin-top:var(--s1)}
.dq-desc{font-size:var(--t-body);color:var(--text-dim);line-height:1.6}
.dq-desc code,.fb-card code,.dq-banner code{font-family:var(--mono);font-size:.9em;background:var(--bg);border:1px solid var(--line);padding:1px 5px;color:var(--text)}
.dq-share{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-sm);color:var(--text-faint);font-variant-numeric:tabular-nums}
.dq-share .bar-track{flex:1;height:4px}
.dq-action{padding:var(--s3) 0 0;border-top:1px solid var(--line);
  font-size:var(--t-body);color:var(--text-dim);line-height:1.55;display:flex;flex-direction:column;gap:var(--s1)}
.dq-action b{display:block}
.dq-foot{font-size:var(--t-sm);color:var(--text-faint);line-height:1.6;max-width:90ch}

/* the findings summary on the dashboard, and the "could not do" notice */
.alert-card{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.alert-card .ttl{display:flex;align-items:center;gap:var(--s2);font-family:var(--fh);font-size:var(--t-body);font-weight:600;color:var(--text);margin:0}
.alert-card .ttl svg{width:15px;height:15px;color:var(--amber);flex:0 0 auto}
.alert-card.ok .ttl svg{color:var(--green)}
.alert-card .muted{font-size:var(--t-body)!important;line-height:1.55}
.alert-list{display:flex;flex-direction:column;gap:var(--s2);font-size:var(--t-body);color:var(--text-dim)}
.alert-list div{display:flex;justify-content:space-between;gap:var(--s3)}
.alert-list b{font-family:var(--fh);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.alert-list .why{display:block;font-size:var(--t-sm);line-height:1.5;margin-top:2px;color:var(--text-faint)}
.btn{
  align-self:flex-start;height:36px;padding:0 var(--s4);border-radius:0;border:1px solid var(--line);
  background:transparent;color:var(--text-dim);font-family:var(--fh);font-size:var(--t-body);cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;transition:border-color .15s,color .15s,background-color .15s,transform .08s;
}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-accent:hover{filter:brightness(1.08);border-color:var(--accent)}

/* ---------- fallback state ---------- */
.fallback{min-height:100vh;display:grid;place-items:center;padding:var(--s6);background:var(--bg)}
.fb-card{max-width:560px;width:100%;padding:var(--s6);background:transparent;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:var(--s4)}
.fb-ico{width:22px;height:22px;color:var(--amber);display:grid;place-items:center}
.fb-ico svg{width:22px;height:22px}
.fb-card h1{margin:0;font-family:var(--fh);font-size:18px;font-weight:600;letter-spacing:-.01em}
.fb-card p{margin:0;font-size:var(--t-md);color:var(--text-dim);line-height:1.6}
.fb-err{font-family:var(--mono);font-size:var(--t-sm);color:var(--red);background:rgba(255,90,110,.07);
  border:1px solid rgba(255,90,110,.25);border-radius:0;padding:var(--s3);word-break:break-word;white-space:pre-wrap}
.fb-card ul{margin:0;padding-left:18px;font-size:var(--t-body);color:var(--text-dim);line-height:1.75}

/* ── mobile ─────────────────────────────────────────────────────────────
   This page is scanned off a QR onto someone's phone at a booth. It is the
   artefact a stranger walks away with, so phone layout is a hard requirement,
   not a nicety. Sidebar becomes a bottom tab bar; tables become cards. */
@media (max-width: 780px){
  /* .shell is display:GRID. `flex-direction:column` on a grid does nothing:
     the two columns survived, .side went position:fixed and left the flow, and
     .main was left sitting in the 236px SIDEBAR column. Measured on a 390px
     phone: grid-template-columns "236px 154px", main 236px wide, 154px of the
     screen unused and every card clipped. That is the "mobile view is ROUGH"
     report, and it was one wrong property. */
  .shell{display:block;height:auto;min-height:100dvh}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;
        flex-direction:row;align-items:center;gap:0;padding:0;z-index:60;
        border-right:0;border-top:1px solid var(--line);background:var(--bg);
        padding-bottom:env(safe-area-inset-bottom,0)}
  .side .brand,.side .side-foot,.side-resize{display:none}
  .drawer{width:100vw}
  .dr-grid{grid-template-columns:minmax(0,1fr)}
  /* The base rule is `nav{flex-direction:column}` and the mobile rule only set
     display:flex, so the tab bar inherited COLUMN and stacked four full-width
     rows down the bottom third of the screen. */
  .side nav,.side .nav{display:flex;flex-direction:row;flex:1;width:100%;align-items:stretch;gap:0;padding:0}
  .nav-item{flex:1;flex-direction:column;justify-content:center;gap:var(--s1);height:auto;
            min-height:56px;padding:var(--s2) 2px;border:0;border-top:2px solid transparent;font-size:11px;
            text-align:center;white-space:nowrap;font-family:var(--fh);font-weight:600}
  .nav-item.active{background:transparent;border-top-color:var(--accent)}
  .nav-item svg{display:block;width:19px;height:19px;color:var(--text-faint)}
  .nav-item.active svg{color:var(--blue)}
  .nav-badge{position:absolute;top:6px;right:22%;transform:scale(.8)}

  .main{width:100%;padding-bottom:70px}   /* clear the tab bar */
  .topbar{position:sticky;top:0;z-index:50;height:auto;min-height:56px;padding:var(--s3) var(--s4);gap:var(--s2);
          background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:17px}
  .top-meta{display:none}
  .content{padding:var(--s4)}
  .content > .page{gap:var(--s4)}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:var(--s3)}
  .k-value{font-size:22px}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .card-h{height:44px}
  .thead,.qrow-head{display:none}
  .tbl-wrap{overflow-x:auto;max-height:none;min-height:0}
  thead th{position:static}
  thead th:first-child,tbody td:first-child{position:static}

  input[type="text"],input[type="search"],select,button{min-height:42px;font-size:16px}
  .search input{height:42px}
  .btn,.fbtn,.pg{min-height:42px}
}
@media (max-width: 400px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .nav-item{font-size:10.5px}
}

/* resolved module panels */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s4)}
.pbody{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.pbody > .p-scope{margin:0 0 var(--s1)}
.panel-wide{grid-column:1/-1}
.panel-off{border-style:dashed;opacity:.7}
.pk-value{font-family:var(--fh);font-size:var(--t-fig);font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:normal}
.pk-unit{margin-top:0}
.pk-secs{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s1)}
.pk-sec{font-size:var(--t-sm);color:var(--text-faint)}
.pk-sec b{font-family:var(--fh);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

/* ══════════════════════════ TYPE ROLES ══════════════════════════════════
   The census before this pass found 51 distinct type styles on five pages:
   sizes of 8, 10, 12, 12.15, 13, 13.5, 14, 15, 16, 20, 22, 28 and 36; nine
   different leadings; a faux-bold weight the page never loaded; names set in
   the prose face and controls split across both faces. This block assigns
   every element one of a small set of roles. Two faces, each with a job:
   DM Sans names, counts, labels, titles and controls; IBM Plex Sans is for
   anything read as a sentence. Three weights each: 400 read, 500 emphasise
   or navigate, 600 announce; 700 only on the figures that lead a card. */

<script>
(function(){
'use strict';

/* ============================== helpers ============================== */
var ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function(c){ return ESC_MAP[c]; });
}
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  if(v === null || v === undefined || v === '') return 0;
  var n = parseFloat(String(v).replace(/[$,\s]/g,''));
  return isFinite(n) ? n : 0;
}
function norm(v){
  return String(v === null || v === undefined ? '' : v).toLowerCase().trim().replace(/[\s\-]+/g,'_');
}
function titleize(v){
  var s = String(v === null || v === undefined ? '' : v).replace(/[_\-]+/g,' ').trim();
  if(!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
var nfInt   = new Intl.NumberFormat('en-US');
var nfM0    = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0});
var nfM2    = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
function money0(n){ return nfM0.format(n || 0); }
function money2(n){ return nfM2.format(n || 0); }
function pct(n, d){ return d ? (Math.round((n / d) * 1000) / 10) : 0; }

function isoDate(v){
  if(v === null || v === undefined || v === '') return '';
  var s = String(v);
  var m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if(m) return m[1];
  var d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return s;
}
/* Relative in the cell, exact on hover: "5w ago" reads faster in a column than
   an ISO date, and the exact date is one hover away. Sorting still uses the
   raw value. */
function relDate(v){
  var iso = isoDate(v);
  var t = Date.parse(iso);
  if(isNaN(t)) return '';
  var days = Math.round((Date.now() - t) / 86400000);
  var past = days >= 0, n = Math.abs(days), txt;
  if(n === 0) txt = 'today';
  else if(n === 1) txt = past ? 'yesterday' : 'tomorrow';
  else if(n < 7)  txt = n + 'd';
  else if(n < 30) txt = Math.round(n / 7) + 'w';
  else if(n < 365) txt = Math.max(1, Math.round(n / 30.4)) + 'mo';
  else txt = Math.max(1, Math.round(n / 365)) + 'y';
  if(n >= 2) txt = past ? txt + ' ago' : 'in ' + txt;
  return txt;
}
function dateCell(v){
  var s = isoDate(v);
  if(!s) return '<span class="dim">&mdash;</span>';
  var r = relDate(v);
  return r ? '<span class="rel" title="'+esc(s)+'">'+esc(r)+'</span>' : esc(s);
}
/* the exact date, with the relative reading beside it: for the drawer */
function dateFull(v){
  var s = isoDate(v);
  if(!s) return '<span class="dim">&mdash;</span>';
  var r = relDate(v);
  return esc(s) + (r ? ' <span class="dim">\u00b7 '+esc(r)+'</span>' : '');
}
function initials(name){
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '\u2014';
  var a = parts[0].charAt(0), b = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
  return (a + b).toUpperCase();
}
function ageDays(created, resolved){
  var c = Date.parse(isoDate(created));
  if(isNaN(c)) return null;
  var e = resolved ? Date.parse(isoDate(resolved)) : Date.now();
  if(isNaN(e)) e = Date.now();
  return Math.max(0, Math.round((e - c) / 86400000));
}
function hexToRgb(hex){
  var h = String(hex || '').trim().replace(/^#/,'');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

/* ============================== state ============================== */
var DATA = null;
var PAGES_DEFAULT = ['dashboard', 'customers', 'tickets', 'quality'];
/* Routing has to know about pages the config added, or add_page produces a nav
   button that silently lands on the dashboard -- a validated, reported,
   announced edit that half-works, which is worse than one that is refused. */
function knownPages(){
  var ids = navItems().map(function(n){ return n.id; });
  return ids.length ? ids : PAGES_DEFAULT;
}
var state = {
  page: 'dashboard',
  cust: { q:'', status:'all', plan:'all', city:'all', sort:'_name', dir:1, page:1, per:50 },
  tick: { q:'', status:'all', sort:'created_at', dir:-1, page:1, per:50 }
};

/* Every lookup table below is keyed by values from the visitor's CSV, so a
   cell reading "constructor", "toString", "valueOf" or "__proto__" resolves
   down Object.prototype and returns a truthy function. That is not an XSS --
   those stringify without quotes or angle brackets -- but it IS a correctness
   bug: a ticket whose status is literally "constructor" was counted as CLOSED,
   silently, because !OPEN_DONE["constructor"] is false. own() is the fix, and
   it is applied at every table lookup rather than only the one that bit. */
function own(map, key, dflt){
  return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : dflt;
}

var OPEN_DONE = {resolved:1, closed:1, done:1, complete:1, completed:1, cancelled:1, canceled:1};
var PRANK = {urgent:4, critical:4, p1:4, high:3, p2:3, medium:2, normal:2, p3:2, low:1, p4:1};

var STATUS_PILL = {
  active:'p-green', current:'p-green', paid:'p-green', resolved:'p-green', closed:'p-gray', done:'p-green',
  pending:'p-amber', trial:'p-amber', in_progress:'p-amber', on_hold:'p-amber', waiting:'p-amber',
  suspended:'p-red', delinquent:'p-red', past_due:'p-red', overdue:'p-red',
  open:'p-blue', new:'p-blue', escalated:'p-red',
  cancelled:'p-gray', canceled:'p-gray', churned:'p-gray', inactive:'p-gray'
};
var PRIO_PILL = {urgent:'p-red', critical:'p-red', p1:'p-red', high:'p-amber', p2:'p-amber',
                 medium:'p-blue', normal:'p-blue', p3:'p-blue', low:'p-gray', p4:'p-gray'};

function pill(value, map){
  var k = norm(value);
  if(!k) return '<span class="pill p-gray">Unknown</span>';
  var cls = own(map, k, '') || 'p-violet';
  return '<span class="pill '+cls+'">'+esc(titleize(value))+'</span>';
}

var ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',

function prep(d){
  var brand = (d && d.brand) || {};
  var out = {
    brand: { name: String(brand.name || 'CRM'), accent: String(brand.accent || '#3d55ff') },
    customers: Array.isArray(d.customers) ? d.customers.slice() : [],
    tickets:   Array.isArray(d.tickets)   ? d.tickets.slice()   : [],
    issues:    Array.isArray(d.issues)    ? d.issues.slice()    : [],
    /* Pre-aggregated by the backend resolver. prep() copies an explicit key
       list, so anything added to data.json and not named here silently arrives
       as undefined -- which is exactly how the first panels build rendered an
       empty dashboard with no error anywhere. */
    panels:    Array.isArray(d.panels)    ? d.panels.slice()    : [],
    /* named here for the reason the comment above gives: an explicit key
       list drops anything it does not mention, and a theme arriving as
       undefined is a customisation that silently did nothing. */
    theme:     (d && typeof d.theme === 'object' && d.theme) || {},
    expiresAt: Number(d.expires_at) || 0,
    ttlDays:   Number(d.ttl_days) || 4,
    segments:  Array.isArray(d.segments)  ? d.segments.slice()  : [],
    /* pages and notices were omitted here on the first pass -- the SAME
       mistake the comment above describes, made again, with two new keys, in
       the same function. The nav silently kept its defaults while the server
       reported every page edit as applied. If you add a key to data.json, add
       it here in the same commit. */
    pages:     Array.isArray(d.pages)     ? d.pages.slice()     : [],
    notices:   Array.isArray(d.notices)   ? d.notices.slice()   : [],
    voice:     (d && d.voice) || null
  };
  out.customers.forEach(function(c){
    c._disp = ((c.first_name || '') + ' ' + (c.last_name || '')).trim();
    c._name = ((c.last_name || '') + ' ' + (c.first_name || '')).trim();
    c._rate = num(c.monthly_rate);
    c._bal  = num(c.balance_due);
    c._st   = norm(c.status);
    c._plan = (c.plan === null || c.plan === undefined || c.plan === '') ? '(no plan)' : String(c.plan);
    c._s = [c._disp, c.email, c.city, c.state, c._plan, c.customer_id].join(' ').toLowerCase();
  });
  var byId = new Map();
  out.customers.forEach(function(c){ byId.set(String(c.customer_id), c); });
  out.tickets.forEach(function(t){
    var c = byId.get(String(t.customer_id));
    t._cust   = c ? c._disp : '';
    t._orphan = !c;
    t._st     = norm(t.status);
    t._prank  = own(PRANK, norm(t.priority), 0);
    t._age    = ageDays(t.created_at, t.resolved_at);
    t._agev   = t._age === null ? -1 : t._age;
    t._open   = !own(OPEN_DONE, t._st, 0);
    t._s = [t.ticket_id, t.subject, t._cust, t.status, t.priority, t.customer_id].join(' ').toLowerCase();
  });
  out.byId = byId;
  /* the record drawer's lookups: a ticket by id, and a customer's tickets */
  var tById = new Map(), tByCust = new Map();
  out.tickets.forEach(function(t){
    tById.set(String(t.ticket_id), t);
    var k = String(t.customer_id), list = tByCust.get(k);
    if(!list){ list = []; tByCust.set(k, list); }
    list.push(t);
  });
  out.tById = tById; out.tByCust = tByCust;
  return out;
}

function stats(){
  var cs = DATA.customers, i, c;
  var total = cs.length, active = 0, mrr = 0, balance = 0, owing = 0;
  var planMap = new Map();
  for(i = 0; i < total; i++){
    c = cs[i];
    var isActive = c._st === 'active';
    if(isActive){ active++; mrr += c._rate; }
    if(c._bal > 0){ balance += c._bal; owing++; }
    var p = planMap.get(c._plan);
    if(!p){ p = {name:c._plan, count:0, mrr:0}; planMap.set(c._plan, p); }
    p.count++;
    if(isActive) p.mrr += c._rate;
  }
  var plans = Array.from(planMap.values()).sort(function(a,b){ return b.count - a.count; });
  if(plans.length > 10){
    var rest = plans.slice(9).reduce(function(a,p){ a.count += p.count; a.mrr += p.mrr; return a; }, {name:'Other plans', count:0, mrr:0});
    plans = plans.slice(0,9).concat([rest]);
  }
  var tq = new Map(), open = 0, urgent = 0;
  DATA.tickets.forEach(function(t){
    var k = norm(t.status) || 'unknown';
    tq.set(k, (tq.get(k) || 0) + 1);
    if(t._open){ open++; if(t._prank >= 4) urgent++; }
  });
  var order = ['new','open','in_progress','pending','on_hold','waiting','escalated','resolved','closed'];
  var queue = Array.from(tq.entries()).map(function(e){ return {status:e[0], count:e[1]}; })
    .sort(function(a,b){
      var ai = order.indexOf(a.status), bi = order.indexOf(b.status);
      if(ai === -1) ai = 99; if(bi === -1) bi = 99;
      return ai - bi || b.count - a.count;
    });
  function ranCountAll(){
    return DATA.issues.filter(function(x){ return x && x.checked !== false; }).length;
  }
  function skippedAll(){ return DATA.issues.length - ranCountAll(); }
  var flagged = DATA.issues.reduce(function(a,x){
    return a + ((x && x.checked === false) ? 0 : num(x && x.count)); }, 0);
  return {
    total:total, active:active, mrr:mrr, balance:balance, owing:owing,
    plans:plans, open:open, urgent:urgent, queue:queue, flagged:flagged,
    ran:ranCountAll(), skipped:skippedAll(),
    tickets:DATA.tickets.length
  };
}

/* ── the config the supervisor shipped ──────────────────────────────────
 * DATA.pages is validated server-side before it arrives: page ids are
 * slugify-derived, column keys come from the same vocabulary as the lists
 * above, page_size from a fixed set. Titles are the only free text, and they
 * are esc()'d at every insertion point. */
function cfgPage(id){
  var pages = DATA.pages || [];
  for(var i = 0; i < pages.length; i++) if(pages[i].id === id) return pages[i];
  return null;
}
function cfgTable(id){ var p = cfgPage(id); return (p && p.table) || null; }

function visibleCols(id, all){
  /* Config chooses WHICH columns and in what ORDER. Filtering again here means
     a stale bundle degrades to the full table rather than an empty one. */
  var t = cfgTable(id);
  if(!t || !t.columns || !t.columns.length) return all;
  var out = [];
  for(var i = 0; i < t.columns.length; i++){
    var c = colByKey(all, t.columns[i]);
    if(c) out.push(c);
  }
  return out.length ? out : all;
}
function tableSearchOn(id){ var t = cfgTable(id); return !t || t.search !== false; }

/* ── the reader's view of a table: hidden columns and row density, kept in
   this browser. Config decides what CAN show (visibleCols); this only
   subtracts, and never below two columns. ── */
var VIEW_KEYS = { cols: 'crm.cols.', density: 'crm.density' };
var viewHidden = {};
function hiddenSet(id){
  if(!viewHidden[id]){
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(VIEW_KEYS.cols + id) || '[]'); } catch(e){ arr = []; }
    viewHidden[id] = Array.isArray(arr) ? arr.map(String) : [];
  }
  return viewHidden[id];
}
function saveHidden(id){
  try {
    if(viewHidden[id] && viewHidden[id].length) localStorage.setItem(VIEW_KEYS.cols + id, JSON.stringify(viewHidden[id]));
    else localStorage.removeItem(VIEW_KEYS.cols + id);
  } catch(e){}
}
function tableCols(id, all){
  var cols = visibleCols(id, all), hid = hiddenSet(id);
  var out = cols.filter(function(c){ return hid.indexOf(c.key) === -1; });
  return out.length >= 2 ? out : cols;
}
function toggleCol(id, key){
  var hid = hiddenSet(id), i = hid.indexOf(key);
  if(i >= 0) hid.splice(i, 1); else hid.push(key);
  saveHidden(id);
}
var DENSITIES = ['compact', 'default', 'relaxed'];

function setDensity(d){ try { if(d === 'default') localStorage.removeItem(VIEW_KEYS.density); else localStorage.setItem(VIEW_KEYS.density, d); } catch(e){} applyDensity(); }

function colByKey(cols, key){
  for(var i = 0; i < cols.length; i++) if(cols[i].key === key) return cols[i];
  return null;
}
function makeCmp(key, type, dir){
  return function(a, b){
    var av = a[key], bv = b[key];
    if(type === 'num'){
      av = num(av); bv = num(bv);
      return av === bv ? 0 : (av < bv ? -1 : 1) * dir;
    }
    av = (av === null || av === undefined) ? '' : String(av).toLowerCase();
    bv = (bv === null || bv === undefined) ? '' : String(bv).toLowerCase();
    if(av === bv) return 0;
    if(av === '') return 1;
    if(bv === '') return -1;
    return (av < bv ? -1 : 1) * dir;
  };
}
function thHTML(prefix, cols, sortKey, dir){
  return cols.map(function(c){
    var on = c.key === sortKey;
    var cls = 'sortable' + (c.right ? ' ta-r' : '') + (on ? ' sorted' : '');
    /* esc() even though c.key is hardcoded today: making table columns
       configurable is exactly what the tenant-config work does next, and this
       attribute is where an authored key would land. */
    return '<th class="'+cls+'" scope="col" tabindex="0" data-sort-'+prefix+'="'+esc(c.key)+'"' +
           ' aria-sort="'+(on ? (dir > 0 ? 'ascending' : 'descending') : 'none')+'">'+esc(c.label)+
           (on ? '<span class="arrow">'+(dir > 0 ? '▲' : '▼')+'</span>' : '')+'</th>';
  }).join('');

function pageNumbers(page, pages){
  var out = [], i;
  if(pages <= 7){ for(i = 1; i <= pages; i++) out.push(i); return out; }
  out.push(1);
  var s = Math.max(2, page - 1), e = Math.min(pages - 1, page + 1);
  if(page <= 3){ s = 2; e = 4; }
  if(page >= pages - 2){ s = pages - 3; e = pages - 1; }
  if(s > 2) out.push('gap');
  for(i = s; i <= e; i++) out.push(i);
  if(e < pages - 1) out.push('gap');
  out.push(pages);
  return out;
}
function pagerHTML(prefix, page, pages, total, start, shown, noun){
  var out = ['<div class="pager"><div class="info">'];
  if(total === 0) out.push('No ' + noun + ' to show');
  else out.push('Showing ' + nfInt.format(start + 1) + '–' + nfInt.format(start + shown) +
                ' of ' + nfInt.format(total) + ' ' + noun);
  out.push('</div><div class="pgs">');
  out.push('<button class="pg" data-pg-'+prefix+'="prev"'+(page <= 1 ? ' disabled' : '')+'>Prev</button>');
  pageNumbers(page, pages).forEach(function(n){
    if(n === 'gap') out.push('<span class="pg-gap">…</span>');
    else out.push('<button class="pg'+(n === page ? ' on' : '')+'" data-pg-'+prefix+'="'+n+'">'+n+'</button>');
  });
  out.push('<button class="pg" data-pg-'+prefix+'="next"'+(page >= pages ? ' disabled' : '')+'>Next</button>');
  out.push('</div></div>');
  return out.join('');
}
