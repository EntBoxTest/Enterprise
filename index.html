function shellHTML(){
  var s = stats();
  /* Seeded here, not in the state literal: the config only exists once DATA
     has been prepped, and page_size was otherwise validated and ignored. */
  state.cust.per = tablePer('customers');
  state.tick.per = tablePer('tickets');

  var initial = (DATA.brand.name.trim()[0] || 'C').toUpperCase();
  var nav = navItems().map(function(n){
    /* count only the checks that actually RAN. A category skipped because the
       file has no such column is not a finding, and badging it as one is how a
       file with none of the four columns appeared to have four problems. */
    var ranCount = DATA.issues.filter(function(x){ return x && x.checked !== false; }).length;
    var badge = (n.id === 'quality' && ranCount)
      ? '<span class="nav-badge">'+nfInt.format(ranCount)+'</span>' : '';
    return '<button class="nav-item'+(state.page === n.id ? ' active' : '')+'" data-nav="'+esc(n.id)+'">'+
           svg(n.id)+'<span>'+esc(n.label)+'</span>'+badge+'</button>';
  }).join('');
  return '' +
  '<div class="shell">' +
    '<aside class="side">' +
      '<div class="brand">' +
        '<div class="mark">'+esc(initial)+'</div>' +
        '<div class="brand-txt">' +
          '<div class="brand-name">'+esc(DATA.brand.name)+'</div>' +
          '<div class="brand-sub">Customer ops</div>' +
        '</div>' +
      '</div>' +
      '<nav>'+nav+'</nav>' +
      '<div class="side-foot">' +
        '<div class="row">Tenant live</div>' +
        '<div>'+nfInt.format(s.total)+' customers · '+nfInt.format(s.tickets)+' tickets</div>' +
        /* How long this CRM has left. The operator list shows it; the CRM
           itself did not, so somebody holding the URL on their phone had no
           idea it was temporary. */
        '<div id="ttl" class="ttl">'+esc(ttlText())+'</div>' +
      '</div>' +
      '<div class="side-resize" id="sideResize" role="separator" aria-orientation="vertical" tabindex="0" ' +
           'aria-label="Resize the sidebar" title="Drag to resize \u00b7 double-click to reset"></div>' +
    '</aside>' +
    '<main class="main">' +
      '<div class="topbar">' +
        '<div>' +
          '<h1 id="pgTitle"></h1>' +
          '<div class="sub" id="pgSub"></div>' +
        '</div>' +
        '<div class="top-meta">' +
          '<span class="chip-live">Provisioned</span>' +
          '<span>'+esc(DATA.brand.name)+' · production</span>' +
        '</div>' +
      '</div>' +
      '<div class="content" id="content"></div>' +
    '</main>' +
  '</div>';
}

/* ============================== dashboard ============================== */
function dashboardHTML(){
  var s = stats();
  var arr = s.mrr * 12;
  var avg = s.active ? s.mrr / s.active : 0;
  var maxPlan = s.plans.reduce(function(m,p){ return Math.max(m, p.count); }, 0) || 1;
  var maxQ = s.queue.reduce(function(m,q){ return Math.max(m, q.count); }, 0) || 1;

  /* context for the figures: windows and series anchored on the file's
     latest date (see latestDate) */
  var anchor = latestDate(), d30 = anchor - 30 * DAY, d60 = anchor - 60 * DAY;
  var inst = inWindow(DATA.customers, 'install_date', d30, anchor, function(c){ return c._rate; });
  var instPrev = inWindow(DATA.customers, 'install_date', d60, d30);
  var opened = inWindow(DATA.tickets, 'created_at', d30, anchor), openedPrev = inWindow(DATA.tickets, 'created_at', d60, d30);
  var resolved = inWindow(DATA.tickets, 'resolved_at', d30, anchor);
  var instM = monthlySeries(DATA.customers, 'install_date', 12, anchor);
  /* the book over time: everyone installed before the window (or undated) is the base */
  var base = DATA.customers.filter(function(c){ var t = tsOf(c.install_date); return t === null || t < instM.from; }).length;
  var bookSeries = [], run = base;
  instM.values.forEach(function(v){ run += v; bookSeries.push(run); });
  var mrrM = monthlySeries(DATA.customers, 'install_date', 12, anchor, function(c){ return c._rate; });
  var tixM = monthlySeries(DATA.tickets, 'created_at', 12, anchor);
  var fromL = monthLabel(instM.from), toL = monthLabel(anchor);

  var kpis =
    kpi('Total customers', nfInt.format(s.total), nfInt.format(s.tickets)+' support tickets on file',
        deltaHTML(inst.n, instPrev.n, inst.n === 1 ? 'install' : 'installs') +
        sparkSVG(bookSeries, 'Customers on the book by month, last twelve months', fromL, toL), 'hero') +
    kpi('Active accounts', nfInt.format(s.active), s.total ? pct(s.active, s.total)+'% of the book' : 'No records loaded',
        proportionHTML(s.active, s.total, pct(s.active, s.total)+' percent of customers are active')) +
    kpi('Monthly recurring revenue', money0(s.mrr), 'From '+nfInt.format(s.active)+' active · '+money0(avg)+' avg · '+money0(arr)+' annualized',
        '<div class="k-delta"><span><b>'+esc(money0(inst.sum))+'</b> added by '+esc(nfInt.format(inst.n))+' install'+(inst.n === 1 ? '' : 's')+' in the last 30 days</span></div>' +
        sparkSVG(mrrM.values, 'Monthly revenue added by new installs, by month', fromL, toL)) +
    kpi('Open tickets', nfInt.format(s.open), s.urgent ? nfInt.format(s.urgent)+' at urgent priority' : 'Nothing at urgent priority',
        deltaHTML(opened.n, openedPrev.n, 'opened') +
        sparkSVG(tixM.values, 'Tickets opened by month, last twelve months', fromL, toL));
  var asOf = '<div class="sec-h"><h2>Key figures</h2><span class="hint">as of '+esc(isoDate(new Date(anchor).toISOString()))+' \u00b7 the latest date in the file \u00b7 '+esc(nfInt.format(resolved.n))+' tickets resolved in the last 30 days</span></div>';

  var bars = s.plans.length ? s.plans.map(function(p, i){
    return '<div class="bar-row">' +
      '<div class="bar-name" title="'+esc(p.name)+'">'+esc(p.name)+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+((p.count / maxPlan) * 100).toFixed(1)+'%"></div></div>' +
      '<div class="bar-num">'+nfInt.format(p.count)+'</div>' +
      '<div class="bar-money">'+money0(p.mrr)+'</div>' +
    '</div>';
  }).join('') : '<div class="dim" style="padding:8px 0">No plan data.</div>';

  var queue = s.queue.length ? s.queue.map(function(q){
    return '<div class="qrow">' +
      '<div>'+pill(q.status, STATUS_PILL)+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+((q.count / maxQ) * 100).toFixed(1)+'%"></div></div>' +
      '<div class="bar-num">'+nfInt.format(q.count)+'</div>' +
    '</div>';
  }).join('') : '<div class="dim" style="padding:8px 0">No tickets.</div>';

  /* skipped checks sort last. A bare '0' beside a category name reads as
     'we looked and it was clean', which is a different claim from 'this
     file has no such column'. */
  var issuesTop = DATA.issues.slice().sort(function(a,b){
    var as = (a && a.checked === false) ? 1 : 0, bs = (b && b.checked === false) ? 1 : 0;
    return as - bs || num(b.count) - num(a.count); }).slice(0,4);
  var alert = DATA.issues.length ? (
    '<div class="card alert-card">' +
      '<div class="ttl">'+svg('quality')+'Data quality findings</div>' +
      /* "across N checks" counted categories that never ran, so a file with
         none of the four columns read as "0 findings across 4 checks" -- which
         claims the data was audited and came back clean. It was not audited. */
      '<div class="muted">The import audit flagged <b style="color:var(--text)">'+nfInt.format(s.flagged)+'</b> findings across '+nfInt.format(s.ran)+' check'+(s.ran===1?'':'s')+'.'+(s.skipped?' '+nfInt.format(s.skipped)+' not applicable to this file.':'')+' No rows were dropped.</div>' +
      /* the itemised list lives on the Data Quality page; here, the top
         finding names what to look at first */
      (issuesTop.length && issuesTop[0].checked !== false && num(issuesTop[0].count) > 0
        ? '<div class="muted">Most flagged: '+esc(issueMeta(issuesTop[0].kind).title)+', '+nfInt.format(num(issuesTop[0].count))+' record'+(num(issuesTop[0].count) === 1 ? '' : 's')+'.</div>' : '') +
      '<button class="btn btn-accent" data-nav="quality">Review findings</button>' +
    '</div>'
  ) : (
    '<div class="card alert-card ok">' +
      '<div class="ttl">'+svg('quality')+'No data quality findings</div>' +
      '<div class="muted">The import audit ran clean against this dataset.</div>' +
    '</div>'
  );

  return '<div class="page">' +
    noticesHTML() +
    '<section class="sec">'+asOf+'<div class="kpis">'+kpis+'</div></section>' +
    panelsHTML() +
    '<section class="sec">' +
      '<div class="sec-h"><h2>Book of business</h2><span class="hint">plans, queue and the import audit</span></div>' +
      '<div class="grid-2">' +
        '<div><div class="card">' +
          '<div class="card-h"><h2>Plan distribution</h2><span class="hint">customers · MRR from active accounts</span></div>' +
          '<div class="chart">'+bars+'</div>' +
        '</div></div>' +
        '<div>' +
          '<div class="card">' +
            '<div class="card-h"><h2>Ticket queue</h2><span class="hint">'+nfInt.format(s.tickets)+' total</span></div>' +
            '<div class="chart">'+queue+'</div>' +
          '</div>' +
          alert +
        '</div>' +
      '</div>' +
    '</section>' +
  '</div>';
}
/* ====================== resolved modules (the fan-out) ======================
 * The backend resolver decides WHAT each panel says; this only decides how it
 * looks. Nothing here reads DATA.customers -- every number arrives pre-
 * aggregated in DATA.panels, which is what lets the same page render a tenant
 * backed by Postgres without a line changing.
 *
 * An "unsupported" panel is rendered, not skipped. The layout is chosen by a
 * language model, and a silently missing panel is undebuggable; a visible
 * "can't chart that, here's why" is honest and takes the same space.
 */
function panelBars(d, donut){
  if(!d.slices || !d.slices.length) return '<div class="dim" style="padding:8px 0">Nothing to show.</div>';
  var max = d.slices.reduce(function(m, x){ return Math.max(m, x.count); }, 0) || 1;
  return d.slices.map(function(x){
    return '<div class="bar-row">' +
      '<div class="bar-name" title="'+esc(x.label)+'">'+esc(x.label)+'</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+((x.count/max)*100).toFixed(1)+'%"></div></div>' +
      '<div class="bar-num">'+nfInt.format(x.count)+'</div>' +
      '<div class="bar-money">'+(donut ? x.pct+'%' : '')+'</div>' +
    '</div>';
  }).join('');
}

function panelTrend(d){
  var pts = d.points || [];
  if(!pts.length) return '<div class="dim" style="padding:8px 0">No dated records.</div>';
  var peak = d.peak || 1;
  return '<div class="trendrow">' + pts.map(function(pt){
    var h = Math.max(4, Math.round((pt.count / peak) * 92));
    return '<div class="trendcol" title="'+esc(pt.at)+': '+pt.count+'">' +
             '<div class="trendbar" style="height:'+h+'%"></div>' +
             '<div class="trendlab">'+esc(String(pt.at).slice(2))+'</div>' +
           '</div>';
  }).join('') + '</div>';
}

function panelTable(d){
  var cols = d.columns || [], rows = d.rows || [];
  if(!rows.length) return '<div class="dim" style="padding:8px 0">No rows.</div>';
  return '<div class="twrap"><table class="tbl"><thead><tr>' +
    cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.slice(0, 8).map(function(r){
      return '<tr>' + cols.map(function(c){ return '<td>'+esc(String(r[c] == null ? '' : r[c]))+'</td>'; }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    (d.total > 8 ? '<div class="dim" style="padding:6px 2px 0;font-size:11px">showing 8 of '+nfInt.format(d.total)+'</div>' : '');
}

function panelQuality(d){
  var rows = d.issues || [];
  if(!rows.length) return '<div class="dim" style="padding:8px 0">The import audit ran clean.</div>';
  return '<div class="alert-list">' + rows.slice(0, 5).map(function(x){
    return '<div><span>'+esc(issueMeta(x.kind).title)+'</span><b>'+nfInt.format(num(x.count))+'</b></div>';
  }).join('') + '</div>';
}

/* A panel kind that did not exist when this file was written.
 *
 * The renderer arrives WITH the panel. It was generated for one request, then
 * checked and actually RUN server-side against a sample of this tenant's data
 * before it was allowed to be stored -- a renderer that parses cleanly and
 * returns undefined is the failure mode that static checks miss, so the gate
 * runs it. What survives is a function body over (data, esc): no network, no
 * DOM, no globals.
 *
 * If it throws HERE it still must not take the page down with it. One broken
 * custom panel degrades to a visible note; the other panels keep their data.
 */
function panelCustom(p){
  var src = (p.data && p.data.render) || '';
  if(!src) return '<div class="dim" style="padding:8px 0">This panel has no renderer.</div>';
  try {
    var fn = new Function('data','esc', src);
    var out = fn(p.data, esc);
    if(typeof out !== 'string' || !out.trim()){
      return '<div class="pk-unsup"><div class="pk-unsup-h">Blank</div>' +
             '<div class="pk-unsup-r">the renderer for this panel returned nothing</div></div>';
    }
    return out;
  } catch(e){
    return '<div class="pk-unsup"><div class="pk-unsup-h">Not drawn</div>' +
           '<div class="pk-unsup-r">'+esc('this panel\u2019s renderer failed: ' + (e && e.message || e))+'</div></div>';
  }
}

/* An OPERATIONS WALL. Same numbers as a donut — one value_counts — read the
   way an operator reads a NOC board: big tiles, a total, severity in colour.

   ⛔ AN UNKNOWN STATUS STAYS GREY. The resolver classifies against the
   vocabularies our own CRMs use and returns "unknown" for anything else. A
   board that paints an unrecognised status red says something false with
   confidence; grey says "I do not know what this is", which is true. */
function panelStatus(d){
  var tiles = d.tiles || [];
  if(!tiles.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var cells = tiles.map(function(t){
    return '<div class="st-tile" data-sev="'+esc(t.severity || 'unknown')+'">' +
             '<div class="st-n">'+esc(nfInt.format(num(t.count)))+'</div>' +
             '<div class="st-l">'+esc(t.label)+'</div>' +
             '<div class="st-p">'+esc(String(t.pct))+'%</div>' +
           '</div>';
  }).join('');
  var foot = d.unknown
    ? '<div class="st-foot">'+esc(nfInt.format(num(d.unknown)))+' records have a '
      + 'status this board does not recognise, so they are left uncoloured</div>'
    : '';
  return '<div class="st-wall">'+cells+'</div>' +
         '<div class="st-total">'+esc(nfInt.format(num(d.total)))+' total</div>' + foot;
}

/* A DISTRIBUTION. Until now a numeric column could only be a kpi — min, max,
   mean — which are statistics, not a shape. bars refuses numerics outright.

   ⛔ BAR HEIGHT IS RELATIVE TO THE TALLEST BIN, not the total. A distribution
   where one bin holds 90% would otherwise draw as one bar and seven invisible
   slivers, which reads as broken rather than as skewed. The resolver computes
   it; this only draws it. */
function panelSpread(d){
  var bins = d.bins || [];
  if(!bins.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var cols = bins.map(function(b){
    return '<div class="sp-col" title="'+esc(b.label)+' · '+esc(String(b.count))+'">' +
             '<div class="sp-bar" style="height:'+esc(String(Math.max(2, b.h)))+'%"></div>' +
           '</div>';
  }).join('');
  return '<div class="sp-plot">'+cols+'</div>' +
         '<div class="sp-axis"><span>'+esc(bins[0].label.split('\u2013')[0])+'</span>' +
           '<span>'+esc(bins[bins.length-1].label.split('\u2013').pop())+'</span></div>' +
         '<div class="sp-foot">'+esc(nfInt.format(num(d.total)))+' records · average '+
           esc(String(d.avg))+'</div>';
}

function panelMatrix(d){
  var rows = d.rows || [], cols = d.cols || [], grid = d.grid || [];
  if(!rows.length || !cols.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var tpl = 'grid-template-columns:minmax(44px,auto) repeat('+cols.length+',1fr) minmax(30px,auto)';
  var h = '<div class="mx-th"></div>';
  for(var c=0;c<cols.length;c++) h += '<div class="mx-th" title="'+esc(cols[c])+'">'+esc(cols[c])+'</div>';
  h += '<div class="mx-th">all</div>';
  var body = '';
  for(var r=0;r<rows.length;r++){
    body += '<div class="mx-rh" title="'+esc(rows[r])+'">'+esc(rows[r])+'</div>';
    var line = grid[r] || [];
    for(var j=0;j<cols.length;j++){
      var cell = line[j] || {n:0,i:0};
      var n = num(cell.n);
      body += '<div class="mx-cell'+(n===0?' mx-zero':'')+'" style="--i:'+esc(String(cell.i||0))+'"' +
                ' title="'+esc(rows[r])+' · '+esc(cols[j])+' — '+esc(nfInt.format(n))+'">' +
                esc(nfInt.format(n))+'</div>';
    }
    body += '<div class="mx-tot">'+esc(nfInt.format(num((d.row_totals||[])[r])))+'</div>';
  }
  var foot = '<div class="mx-rh"></div>';
  for(var k=0;k<cols.length;k++) foot += '<div class="mx-tot">'+esc(nfInt.format(num((d.col_totals||[])[k])))+'</div>';
  foot += '<div class="mx-tot"><b>'+esc(nfInt.format(num(d.total)))+'</b></div>';
  return '<div class="mx-grid" style="'+tpl+'">'+h+body+foot+'</div>' +
         '<div class="mx-foot">'+esc(String(d.row_label||''))+' \u00d7 '+
           esc(String(d.col_label||''))+' · '+esc(nfInt.format(num(d.total)))+' records</div>';
}

function panelLeaderboard(d){
  var rows = d.rows || [];
  if(!rows.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var avg = d.headline === 'avg';
  var body = rows.map(function(r){
    /* The TITLE decides the headline, the same rule kpi follows: a panel
       called "Average revenue per plan" must not lead with the sum. */
    var lead = avg ? nfM2.format(num(r.avg)) : nfM0.format(num(r.total));
    var sub  = avg ? nfM0.format(num(r.total)) + ' total'
                   : nfInt.format(num(r.n)) + ' rows';
    return '<div class="lb-row" title="'+esc(r.label)+' — '+esc(String(r.pct))+'% of the total">' +
             '<div class="lb-name">'+esc(r.label)+'</div>' +
             '<div class="lb-track"><div class="lb-fill" style="width:'+
               esc(String(num(r.total) ? Math.max(2, num(r.w)) : 0))+'%"></div></div>' +
             '<div class="lb-val">'+esc(lead)+'<span class="lb-sub">'+esc(sub)+'</span></div>' +
           '</div>';
  }).join('');
  /* ⛔ COVERAGE IS PRINTED, NOT IMPLIED. A total computed over part of the
     book must not be able to pass as the whole of it. */
  var warn = (num(d.skipped) > 0)
    ? '<div class="lb-warn">'+esc(nfInt.format(num(d.skipped)))+
      ' rows had no readable '+esc(String(d.measure||'number'))+
      ' and are not in these totals</div>' : '';
  return body +
    '<div class="lb-foot">'+esc(nfM0.format(num(d.total)))+' across '+
      esc(nfInt.format(num(d.covered)))+' of '+esc(nfInt.format(num(d.of)))+
      ' rows · by '+esc(String(d.measure||''))+'</div>' + warn;
}

function panelAging(d){
  var bands = d.bands || [];
  if(!bands.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var body = bands.map(function(b){
    return '<div class="ag-row" data-sev="'+esc(b.sev||'ok')+'" title="'+
             esc(b.label)+' — '+esc(String(b.pct))+'%">' +
             '<div class="ag-name">'+esc(b.label)+'</div>' +
             /* ⛔ A ZERO MUST DRAW NOTHING. The 2% floor exists so a tiny
                non-zero band stays visible, but applied to a count of 0 it
                painted a coloured sliver for a band that is empty — on the
                live tenant, "scheduled 0" rendered an amber mark that reads
                as "a few". A floor for small, nothing for none. */
             '<div class="ag-track"><div class="ag-fill" style="width:'+
               esc(String(num(b.count) ? Math.max(2, num(b.h)) : 0))+'%"></div></div>' +
             '<div class="ag-val">'+esc(nfInt.format(num(b.count)))+'</div>' +
           '</div>';
  }).join('');
  /* The as-of date and the band edges are STATED, not implied — an ageing
     chart whose "today" is unstated cannot be checked. */
  return body + '<div class="ag-foot">days since '+esc(String(d.column||''))+
    ' · as of '+esc(String(d.as_of||''))+' · '+
    esc(nfInt.format(num(d.total)))+' rows</div>';
}

function panelFlow(d){
  var rows = d.rows || [];
  if(!rows.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var cols = rows.map(function(r){
    return '<div class="fl-col" title="'+esc(r.label)+' — '+esc(String(r.in))+' in, '+
             esc(String(r.out))+' out, backlog '+esc(String(r.backlog))+'">' +
             '<div class="fl-in" style="height:'+esc(String(num(r.in)?Math.max(2,num(r.hin)):0))+'%"></div>' +
             '<div class="fl-out" style="height:'+esc(String(num(r.out)?Math.max(2,num(r.hout)):0))+'%"></div>' +
           '</div>';
  }).join('');
  /* BOTH TOTALS AND THE DIFFERENCE, so a visitor can check the arithmetic
     against any other panel rather than taking the backlog on trust. */
  var key = d.closed
    ? '<span class="fl-sw" style="background:var(--accent)"></span>'+esc(nfInt.format(num(d.total_in)))+' opened'+
      ' <span class="fl-sw" style="background:var(--text-faint);margin-left:10px"></span>'+
      esc(nfInt.format(num(d.total_out)))+' closed · '+esc(nfInt.format(num(d.open_now)))+' still open'
    : esc(nfInt.format(num(d.total_in)))+' opened';
  return '<div class="fl-plot">'+cols+'</div>' +
         '<div class="fl-axis"><span>'+esc(rows[0].label)+'</span><span>'+
           esc(rows[rows.length-1].label)+'</span></div>' +
         '<div class="fl-key">'+key+'</div>';
}

function panelRhythm(d){
  var slots = d.slots || [];
  if(!slots.length) return '<div class="dim" style="padding:8px 0">nothing to show</div>';
  var bars = slots.map(function(s){
    return '<div class="rh-col" data-peak="'+(s.peak?'yes':'no')+'" title="'+
             esc(s.label)+' — '+esc(String(s.count))+'">' +
             '<div class="rh-bar" style="height:'+esc(String(num(s.count)?Math.max(2,num(s.h)):0))+'%"></div>' +
           '</div>';
  }).join('');
  var labs = slots.map(function(s){
    return '<div class="rh-lab" style="flex:1">'+esc(s.label)+'</div>';
  }).join('');
  /* ⛔ THE SENTENCE IS THE PANEL. Seven near-equal bars are visually
     indistinguishable from seven meaningful ones, and somebody who staffs
     Saturday because it beat Friday by a few percent has been misled by a
     chart whose every number was correct. */
  return '<div class="rh-plot">'+bars+'</div>' +
         '<div style="display:flex;gap:5px">'+labs+'</div>' +
         '<div class="rh-say" data-even="'+(d.even?'yes':'no')+'">'+esc(String(d.verdict||''))+'</div>';
}

function panelCompleteness(d){
  var rows = d.rows || [];
  if(!rows.length) return '<div class="dim" style="padding:8px 0">no columns</div>';
  var body = rows.map(function(r){
    return '<div class="cp-row" data-gap="'+(num(r.blank)?'yes':'no')+'" title="'+
             esc(r.column)+' — '+esc(String(r.blank))+' blank">' +
             '<div class="cp-name">'+esc(r.column)+'</div>' +
             '<div class="cp-track"><div class="cp-fill" style="width:'+
               esc(String(num(r.filled)?Math.max(2,num(r.pct)):0))+'%"></div></div>' +
             '<div class="cp-val">'+esc(nfInt.format(num(r.filled)))+' / '+
               esc(nfInt.format(num(d.of)))+
               (num(r.blank) ? ' · '+esc(nfInt.format(num(r.blank)))+' blank' : '') +
             '</div>' +
           '</div>';
  }).join('');
  return '<div class="gp-head">'+esc(String(d.headline||''))+'</div>'+body;
}

function panelGaps(d){
  var rows = d.rows || [];
  if(!num(d.missing)) return '<div class="dim" style="padding:8px 0">nothing is missing</div>';
  var body = rows.map(function(r){
    /* BOTH numbers, always: "94 of 94" is a different claim from "94", and
       the denominator is what stops a wall of 100%s reading as a finding. */
    return '<div class="gp-row" title="'+esc(r.label)+'">' +
             '<div class="cp-name">'+esc(r.label)+'</div>' +
             '<div class="gp-track"><div class="gp-fill" style="width:'+
               esc(String(num(r.missing)?Math.max(2,num(r.pct)):0))+'%"></div></div>' +
             '<div class="cp-val">'+esc(nfInt.format(num(r.missing)))+' of '+
               esc(nfInt.format(num(r.of)))+'</div>' +
           '</div>';
  }).join('');
  var say = d.verdict ? '<div class="gp-say">'+esc(String(d.verdict))+'</div>' : '';
  return '<div class="gp-head">'+esc(nfInt.format(num(d.missing)))+' of '+
           esc(nfInt.format(num(d.of)))+' have no '+esc(String(d.column||''))+
           ' · '+esc(String(d.pct))+'%</div>' + body + say;
}

function panelBody(p){
  var d = p.data || {};
  switch(p.kind){
    case 'kpi':
      var sec = (d.secondary || []).map(function(x){
        return '<span class="pk-sec">'+esc(x.label)+' <b>'+esc(String(x.value))+'</b></span>';
      }).join('');
      /* the unit is dropped when it only repeats the panel's own title
         ("Total records" / "records"): one label per fact */
      var unit = String(d.unit || '');
      var dupUnit = unit && p.title && p.title.toLowerCase().indexOf(unit.toLowerCase()) >= 0;
      return '<div class="pk-value">'+esc(nfInt.format(num(d.value)))+'</div>' +
             (unit && !dupUnit ? '<div class="pk-unit">'+esc(unit)+'</div>' : '') +
             (sec ? '<div class="pk-secs">'+sec+'</div>' : '');
    case 'bars':  case 'map': return panelBars(d, false);
    case 'donut':             return panelBars(d, true);
      case 'status':            return panelStatus(d);
      case 'spread':            return panelSpread(d);
      case 'matrix':            return panelMatrix(d);
      case 'leaderboard':       return panelLeaderboard(d);
      case 'aging':             return panelAging(d);
      case 'flow':              return panelFlow(d);
      case 'rhythm':            return panelRhythm(d);
      case 'completeness':      return panelCompleteness(d);
      case 'gaps':              return panelGaps(d);
    case 'trend':             return panelTrend(d);
    case 'table':             return panelTable(d);
    case 'quality':           return panelQuality(d);
    case 'custom':            return panelCustom(p);
    case 'tickets':
      return '<div class="dim" style="padding:8px 0">'+esc(d.note || 'No ticket source connected.')+'</div>';
    case 'unsupported':
      return '<div class="pk-unsup">' +
               '<div class="pk-unsup-h">Not charted</div>' +
               '<div class="pk-unsup-r">'+esc(p.note || 'this panel could not be built')+'</div>' +
             '</div>';
    default:
      return '<div class="dim" style="padding:8px 0">Unknown panel.</div>';
  }
}

/* Requests that could not be honoured, and why.
 *
 * tenant_config.py's stated invariant is that nothing is ever silently
 * dropped -- every rejected op becomes a notice carrying the request and the
 * reason. Those notices reached data.json and were rendered by NOTHING, so the
 * promise held on the server and broke on the artifact the visitor is handed.
 * An adversarial pass found it. */
function noticesHTML(){
  var ns = Array.isArray(DATA.notices) ? DATA.notices : [];
  if(!ns.length) return '';
  return '<div class="card alert-card notice">' +
           '<div class="ttl">' + svg('quality') +
             (ns.length === 1 ? 'One thing I could not do' : ns.length + ' things I could not do') +
           '</div>' +
           '<div class="alert-list">' + ns.slice(0, 5).map(function(n){
             return '<div style="display:block"><span>' + esc(n.request) + '</span>' +
                    '<span class="why">' + esc(n.why) + '</span></div>';
           }).join('') + '</div>' +
         '</div>';
}

function panelsHTML(){
  var ps = Array.isArray(DATA.panels) ? DATA.panels : [];
  /* A module that restates a figure the KPI strip already shows ("Total
     records 1,240" under "Total customers 1,240") is filler. Hidden here, in
     the view only; the resolver's output is untouched.
     
     ⛔ DECIDED FROM THE TITLE ALONE -- NO RAW ROWS. This compared the panel's
     value against the raw customers array's length, which broke the
     renderer must take its numbers from the resolved panel, because a
     Postgres-backed tenant ships no `customers` array at all and every such
     read becomes 0. tenant.test.mjs caught it 5 runs out of 5.
     
     ⚠️ AND PASSING THE TOTAL IN AS AN ARGUMENT WOULD NOT HAVE FIXED IT -- it
     would move the same wrong number one frame further out and satisfy only
     the letter of the test. The strip always shows "Total customers", so a
     KPI with this title is a restatement whatever its value; the comparison
     was belt-and-braces and it was the belt that needed the rows. If such a
     panel ever carries a DIFFERENT number, the strip beside it makes that
     visible, which is better than hiding one of the two. */
  ps = ps.filter(function(p){
    return !(p && p.kind === 'kpi' &&
             /^total (records|customers|rows)$/i.test(String(p.title || '')));
  });
  if(!ps.length) return '';
  var built = ps.filter(function(p){ return p.kind !== 'unsupported'; }).length;
  return '<section class="sec">' +
         '<div class="sec-h"><h2>Chosen for '+esc(DATA.brand.name)+'</h2>' +
           '<span class="hint">'+built+' of '+ps.length+' modules resolved from your data</span>' +
         '</div>' +
         '<div class="pgrid">' + ps.map(function(p){
           /* A matrix EARNS its width rather than being given it. At four
              or more columns the auto-fit grid hands it ~320px and the
              headers truncate to "pendin.../suspen...", which is a grid
              nobody can read; a 2- or 3-column cross fits a normal card
              fine and spanning it full-width just leaves a hole. */
           var wide = (p.kind === 'table' || p.kind === 'trend' ||
                       p.kind === 'flow' || p.kind === 'completeness' ||
                       (p.kind === 'matrix' &&
                        ((p.data && p.data.cols) || []).length >= 4));
           return '<div class="card panel'+(wide ? ' panel-wide' : '')+
                  (p.kind === 'unsupported' ? ' panel-off' : '')+'">' +
                    '<div class="card-h"><h2>'+esc(p.title)+'</h2>' +
                      (p.column ? '<span class="hint">'+esc(p.column)+'</span>' : '') +
                    '</div>' +
                    '<div class="pbody">' + scopeLine(p) + panelBody(p) + '</div>' +
                  '</div>';
         }).join('') + '</div>' +
         '</section>';
}

/* WHAT THIS PANEL IS ABOUT, when it is about a subset.
 *
 * A filtered figure that does not SAY it is filtered is the same lie as an
 * unfiltered one under a narrowed title -- just harder to catch, because the
 * number is now correct and only the framing is missing. "Past Due Customers:
 * 34" is indistinguishable from a wrong answer unless the panel also says
 * "34 of 240 -- status is one of [suspended, cancelled]".
 *
 * Reads scope off the panel, which resolve() stamps whenever a `where` was
 * applied. Absent on unfiltered panels, so they render exactly as before.
 */
function scopeLine(p){
  if(!p) return '';
  /* A CAVEAT ON A BUILT PANEL. p.note was only ever rendered inside the
     `unsupported` branch, so a note set on a kpi -- "counts all 240 rows, the
     title suggests a subset" -- was computed, serialised, and shown to nobody.
     That is the same half-built shape the scope line was, one field along. */
  if(p.note && p.kind !== 'unsupported'){
    return '<div class="p-scope p-warn">'+esc(p.note)+'</div>';
  }
  var s = p.scope;
  if(!s || !s.where) return '';
  var of = (typeof s.of === 'number' && typeof s.matched === 'number')
    ? nfInt.format(s.matched)+' of '+nfInt.format(s.of)+' \u00b7 ' : '';
  return '<div class="p-scope">'+esc(of + s.where)+'</div>';
}

function kpi(label, value, sub, extra, cls){
  return '<div class="card kpi'+(cls ? ' '+cls : '')+'"><div class="k-label">'+esc(label)+'</div>' +
         '<div class="k-value">'+esc(value)+'</div>' +
         '<div class="k-sub">'+esc(sub)+'</div>' + (extra || '') + '</div>';
}

/* ── trend arithmetic, from the dates the file carries ──
   The anchor is the latest date in the file, not the wall clock: a demo file
   whose last record is six weeks old would otherwise read "0 in the last 30
   days" on every card, which is true and useless. The strip says which. */
var DAY = 86400000;
function tsOf(v){ var t = Date.parse(isoDate(v)); return isNaN(t) ? null : t; }
function latestDate(){
  var m = null;
  function see(v){ var t = tsOf(v); if(t !== null && (m === null || t > m)) m = t; }
  DATA.customers.forEach(function(c){ see(c.install_date); see(c.last_payment_date); });
  DATA.tickets.forEach(function(t){ see(t.created_at); see(t.resolved_at); });
  return m === null ? Date.now() : m;
}
function inWindow(list, field, from, to, fn){
  var n = 0, sum = 0;
  for(var i = 0; i < list.length; i++){
    var t = tsOf(list[i][field]);
    if(t !== null && t > from && t <= to){ n++; sum += fn ? fn(list[i]) : 0; }
  }
  return { n: n, sum: sum };
}
/* counts (or sums) per calendar month, oldest first, ending at the anchor's month */
function monthlySeries(list, field, months, anchor, fn){
  var a = new Date(anchor), out = [], starts = [];
  for(var k = months - 1; k >= 0; k--) starts.push(new Date(a.getFullYear(), a.getMonth() - k, 1).getTime());
  starts.push(new Date(a.getFullYear(), a.getMonth() + 1, 1).getTime());
  for(var i = 0; i < months; i++) out.push(0);
  for(var j = 0; j < list.length; j++){
    var t = tsOf(list[j][field]); if(t === null) continue;
    for(var m = 0; m < months; m++) if(t >= starts[m] && t < starts[m + 1]){ out[m] += fn ? fn(list[j]) : 1; break; }
  }
  return { values: out, from: starts[0], to: starts[months] };
}
function monthLabel(ms){ return new Date(ms).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }).replace(' ', ' \u2019'); }
function sparkSVG(values, title, fromLabel, toLabel){
  var n = values.length; if(n < 2) return '';
  var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  if(max === min){ max = min + 1; }
  var W = 100, H = 36, pad = 3;
  var pts = values.map(function(v, i){
    var x = (i / (n - 1)) * W, y = pad + (1 - (v - min) / (max - min)) * (H - pad * 2);
    return [x, y];
  });
  var last = pts[n - 1];
  return '<div class="k-spark" role="img" aria-label="'+esc(title)+'">' +
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' +
      '<line class="base" x1="0" y1="'+(H - 0.5)+'" x2="'+W+'" y2="'+(H - 0.5)+'"/>' +
      '<polyline points="'+pts.map(function(q){ return q[0].toFixed(2)+','+q[1].toFixed(2); }).join(' ')+'"/>' +
      '<rect class="pt" x="'+(last[0] - 1.6).toFixed(2)+'" y="'+(last[1] - 2).toFixed(2)+'" width="3.2" height="4"/>' +
    '</svg>' +
    (fromLabel ? '<div class="k-spark-l"><span>'+esc(fromLabel)+'</span><span>'+esc(toLabel || '')+'</span></div>' : '') +
  '</div>';
}
/* "25 installs in the last 30 days, up 8% on the 30 before" -- or the honest
   version when there is nothing to compare against */
function deltaHTML(cur, prev, noun, fmt){
  fmt = fmt || function(v){ return nfInt.format(v); };
  var lead = '<b>'+esc(fmt(cur))+'</b> '+esc(noun)+' in the last 30 days';
  var tail;
  if(prev > 0){
    var ch = Math.round(((cur - prev) / prev) * 100);
    if(ch === 0) tail = 'level with the 30 before';
    else tail = '<span class="k-dir '+(ch > 0 ? 'up' : 'down')+'" aria-hidden="true"></span>'+esc(Math.abs(ch)+'%')+' '+(ch > 0 ? 'up on' : 'down on')+' the 30 before';
  } else tail = cur > 0 ? 'none in the 30 before' : 'none in the 30 before either';
  return '<div class="k-delta"><span>'+lead+'</span><span>'+tail+'</span></div>';
}
function proportionHTML(part, whole, label){
  var p = whole ? Math.max(0, Math.min(100, (part / whole) * 100)) : 0;
  return '<div class="k-bar" role="img" aria-label="'+esc(label)+'"><div class="bar-track"><div class="bar-fill" style="width:'+p.toFixed(1)+'%"></div></div></div>';
}

 * tickets that carry its customer_id, and the dates it carries laid out as a

function drValue(v){ return (v === null || v === undefined || v === '') ? '<span class="dim">\u2014</span>' : esc(v); }

function tlHTML(items){

function openRecord(kind, id, push){

  if(!exists) return;
  if(push && drawer.kind) drawer.stack.push({ kind: drawer.kind, id: drawer.id });
  if(!drawer.kind){
    var a = document.activeElement;
    drawer.returnTo = (a && a.closest && a.closest('tr.rlink')) ? a : null;
  }
  drawer.kind = kind; drawer.id = id;
  paintDrawer(); markOpenRow();
  try { history.replaceState(null, '', drawerHash()); } catch(e){}
}
function backRecord(){
  var prev = drawer.stack.pop();
  if(!prev){ closeDrawer(); return; }
  drawer.kind = prev.kind; drawer.id = prev.id;
  paintDrawer(); markOpenRow();
  try { history.replaceState(null, '', drawerHash()); } catch(e){}
}

  if(!drawer.kind) return;
  drawer.kind = null; drawer.id = null; drawer.stack = [];
  paintDrawer(); markOpenRow();
  try { history.replaceState(null, '', drawerHash()); } catch(e){}

/* the record named in the hash's query, if any: #/customers?c=CUST-1 */
function drawerFromHash(){

  if(!m){ if(drawer.kind){ drawer.kind = null; drawer.id = null; drawer.stack = []; paintDrawer(); } return; }
  var id = decodeURIComponent(m[2]);
  if(drawer.kind === m[1] && drawer.id === id) return;

function ttlText(){
  var at = DATA.expiresAt;
  if(!at) return 'temporary environment';
  var left = at * 1000 - Date.now();
  if(left <= 0) return 'this environment has expired';
  var days = left / 86400000;
  if(days >= 1) return 'deletes in ' + days.toFixed(1) + ' days';
  var hrs = left / 3600000;
  if(hrs >= 1)  return 'deletes in ' + Math.round(hrs) + ' hours';
  return 'deletes in ' + Math.max(1, Math.round(left / 60000)) + ' minutes';
}

/* Sidebar width: a CSS variable on .shell, dragged by the handle on the
   sidebar's edge, remembered in this browser. Arrow keys nudge it for anyone
   who cannot drag. */
var SIDE_MIN = 160, SIDE_MAX = 420, SIDE_DEFAULT = 240, SIDE_KEY = 'crm.side.w';
function sideWidth(){ try { var v = +localStorage.getItem(SIDE_KEY); return v >= SIDE_MIN && v <= SIDE_MAX ? v : SIDE_DEFAULT; } catch(e){ return SIDE_DEFAULT; } }
function setSideWidth(shell, w, remember){
  w = Math.max(SIDE_MIN, Math.min(SIDE_MAX, Math.round(w)));
  shell.style.setProperty('--sideW', w + 'px');
  if(remember){ try { if(w === SIDE_DEFAULT) localStorage.removeItem(SIDE_KEY); else localStorage.setItem(SIDE_KEY, String(w)); } catch(e){} }
  return w;
}
function initSideResize(){
  var shell = document.querySelector('.shell'), h = document.getElementById('sideResize');
  if(!shell || !h) return;
  setSideWidth(shell, sideWidth(), false);
  var startX = 0, startW = 0, w = 0;
  h.addEventListener('pointerdown', function(ev){
    if(ev.button !== 0) return;
    startX = ev.clientX; startW = w = shell.querySelector('.side').getBoundingClientRect().width;
    h.classList.add('is-dragging'); shell.classList.add('is-resizing');
    try { h.setPointerCapture(ev.pointerId); } catch(e){}
    ev.preventDefault();
  });
  h.addEventListener('pointermove', function(ev){
    if(!h.classList.contains('is-dragging')) return;
    w = setSideWidth(shell, startW + (ev.clientX - startX), false);
  });
  function end(){
    if(!h.classList.contains('is-dragging')) return;
    h.classList.remove('is-dragging'); shell.classList.remove('is-resizing');
    setSideWidth(shell, w, true);
  }
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  h.addEventListener('dblclick', function(){ setSideWidth(shell, SIDE_DEFAULT, true); });
  h.addEventListener('keydown', function(ev){
    var cur = shell.querySelector('.side').getBoundingClientRect().width, step = ev.shiftKey ? 32 : 8;
    if(ev.key === 'ArrowLeft'){ setSideWidth(shell, cur - step, true); ev.preventDefault(); }
    else if(ev.key === 'ArrowRight'){ setSideWidth(shell, cur + step, true); ev.preventDefault(); }
    else if(ev.key === 'Home' || ev.key === 'Enter'){ setSideWidth(shell, SIDE_DEFAULT, true); ev.preventDefault(); }
  });
}
function render(){
  var app = document.getElementById('app');
  if(mounted !== 'shell'){
    app.innerHTML = shellHTML();
    initSideResize();
    mounted = 'shell';
  } else {
    var items = app.querySelectorAll('[data-nav]');
    for(var i = 0; i < items.length; i++){
      if(items[i].classList.contains('nav-item')){
        items[i].classList.toggle('active', items[i].getAttribute('data-nav') === state.page);
      }
    }
  }
  var meta = pageMeta(state.page) || pageMeta('dashboard');
  document.getElementById('pgTitle').textContent = meta.title;
  document.getElementById('pgSub').textContent = meta.sub;

  var content = document.getElementById('content');
  content.scrollTop = 0;
  if(state.page === 'customers'){
    content.innerHTML = customersHTML();
    paintCustomers();
  } else if(state.page === 'tickets'){
    content.innerHTML = ticketsHTML();
    paintTickets();
  } else if(state.page === 'quality'){
    content.innerHTML = qualityHTML();
  } else {
    content.innerHTML = dashboardHTML();
  }
}
function route(){
  var h = String(location.hash || '').replace(/^#\/?/, '').split('?')[0];
  if(knownPages().indexOf(h) === -1) h = knownPages()[0] || 'dashboard';
  state.page = h;
  render();
  drawerFromHash();

function go(page){
  if(('#/' + page) === location.hash) { state.page = page; render(); return; }
  location.hash = '#/' + page;

/* ============================== events ============================== */
function toggleSort(st, key){
  if(st.sort === key) st.dir = -st.dir;
  else { st.sort = key; st.dir = 1; }
  st.page = 1;
}
function applyPage(st, raw, repaint){
  var v = String(raw);
  if(v === 'prev') st.page = Math.max(1, st.page - 1);
  else if(v === 'next') st.page = st.page + 1;
  else {
    var n = parseInt(v, 10);
    if(!isFinite(n)) return;
    st.page = n;
  }
  repaint();
}
function wireEvents(){
  document.addEventListener('click', function(e){
    var el = e.target;
    if(!el || typeof el.closest !== 'function') return;
    var hit;

    /* the View popover closes on any click outside it */
    if(!el.closest('.vwrap')) closePops();

    hit = el.closest('[data-nav]');
    if(hit){ closeDrawer(); go(hit.getAttribute('data-nav')); return; }

    /* table view controls */
    hit = el.closest('[data-vpop]');
    if(hit){ togglePop(hit.getAttribute('data-vpop')); return; }
    hit = el.closest('.vseg button[data-density]');
    if(hit){
      setDensity(hit.getAttribute('data-density'));
      var seg = hit.parentNode.querySelectorAll('button');
      for(var si = 0; si < seg.length; si++){ var on = seg[si] === hit; seg[si].classList.toggle('on', on); seg[si].setAttribute('aria-pressed', on ? 'true' : 'false'); }
      return;
    }
    hit = el.closest('[data-vreset]');
    if(hit){ var vid = hit.getAttribute('data-vreset'); viewHidden[vid] = []; saveHidden(vid); setDensity('default'); repaintTable(vid); return; }
    if(el.closest('.vpop')) return;                    /* checkboxes inside: the change handler owns them */

    hit = el.closest('[data-cstatus]');
    if(hit){
      state.cust.status = hit.getAttribute('data-cstatus'); state.cust.page = 1;
      render();
      var cbox = document.getElementById('custSearch'); if(cbox) cbox.focus();
      return;
    }
    hit = el.closest('[data-clear-c]');
    if(hit){
      state.cust.q = '';
      if(hit.getAttribute('data-clear-c') === 'all'){ state.cust.status = 'all'; state.cust.plan = 'all'; state.cust.city = 'all'; }
      state.cust.page = 1; render(); return;
    }
    hit = el.closest('[data-clear-t]');
    if(hit){
      state.tick.q = '';
      if(hit.getAttribute('data-clear-t') === 'all') state.tick.status = 'all';
      state.tick.page = 1; render(); return;
    }

    /* the record drawer */
    hit = el.closest('[data-dr-back]');
    if(hit){ backRecord(); return; }
    hit = el.closest('[data-dr-close]');
    if(hit){ closeDrawer(); return; }
    hit = el.closest('[data-dr-tickets]');
    if(hit){
      var cid = hit.getAttribute('data-dr-tickets');
      closeDrawer();
      state.tick.q = cid; state.tick.status = 'all'; state.tick.page = 1;
      go('tickets'); return;
    }
    if(el.closest('a[href]')) return;                 /* a mail or phone link inside a row: let it be */
    hit = el.closest('[data-open-c]');
    if(hit){ openRecord('c', hit.getAttribute('data-open-c'), !!hit.closest('#drawer')); return; }
    hit = el.closest('[data-open-t]');
    if(hit){ openRecord('t', hit.getAttribute('data-open-t'), !!hit.closest('#drawer')); return; }

    hit = el.closest('[data-sort-c]');
    if(hit){ toggleSort(state.cust, hit.getAttribute('data-sort-c')); paintCustomers(); return; }

    hit = el.closest('[data-sort-t]');
    if(hit){ toggleSort(state.tick, hit.getAttribute('data-sort-t')); paintTickets(); return; }

    hit = el.closest('[data-pg-c]');
    if(hit){ applyPage(state.cust, hit.getAttribute('data-pg-c'), paintCustomers); return; }

    hit = el.closest('[data-pg-t]');
    if(hit){ applyPage(state.tick, hit.getAttribute('data-pg-t'), paintTickets); return; }

    hit = el.closest('[data-tstatus]');
    if(hit){
      state.tick.status = hit.getAttribute('data-tstatus');
      state.tick.page = 1;
      render();
      var box = document.getElementById('tickSearch');
      if(box) box.focus();
      return;
    }

    hit = el.closest('[data-retry]');
    if(hit){ location.reload(); return; }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if(!t || !t.id) return;
    if(t.id === 'custSearch'){ state.cust.q = t.value; state.cust.page = 1; paintCustomers(); }
    else if(t.id === 'tickSearch'){ state.tick.q = t.value; state.tick.page = 1; paintTickets(); }
  });
  document.addEventListener('change', function(e){
    var t = e.target;
    if(!t) return;
    if(t.id === 'custPlan'){ state.cust.plan = t.value; state.cust.page = 1; t.classList.toggle('on', t.value !== 'all'); paintCustomers(); return; }
    if(t.id === 'custCity'){ state.cust.city = t.value; state.cust.page = 1; t.classList.toggle('on', t.value !== 'all'); paintCustomers(); return; }
    if(t.matches && t.matches('input[data-col]')){
      var id = t.getAttribute('data-table');
      toggleCol(id, t.getAttribute('data-col'));
      /* repaint the table and the control, and keep the popover open */
      repaintTable(id); togglePop(id);
      var again = document.querySelector('#vpop-'+id+' input[data-col="'+t.getAttribute('data-col')+'"]');
      if(again) again.focus();
    }
  });

  document.addEventListener('keydown', function(e){
    var a = document.activeElement;
    var inField = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable);
    /* Escape: the popover first, then the drawer */
    if(e.key === 'Escape' && document.querySelector('.vpop:not([hidden])')){ e.preventDefault(); closePops(); return; }
    if(e.key === 'Escape' && drawer.kind){ e.preventDefault(); closeDrawer(); return; }
    /* Enter or Space on a sortable header sorts */
    if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('th.sortable')){ e.preventDefault(); e.target.click(); return; }
    /* rows: arrows (or j / k) walk the list; with a record open they walk the records */
    var down = e.key === 'ArrowDown' || (e.key === 'j' && !inField), up = e.key === 'ArrowUp' || (e.key === 'k' && !inField);
    if((down || up) && !e.metaKey && !e.ctrlKey && !e.altKey){
      var rows = Array.prototype.slice.call(document.querySelectorAll('tbody tr.rlink'));
      if(rows.length){
        var idx = -1;
        if(drawer.kind){
          for(var r = 0; r < rows.length; r++) if(rows[r].classList.contains('is-open')){ idx = r; break; }
        } else if(a && a.matches && a.matches('tr.rlink')) idx = rows.indexOf(a);
        else if(inField) return;
        var next = idx === -1 ? (down ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, idx + (down ? 1 : -1)));
        var row = rows[next];
        e.preventDefault();
        if(drawer.kind){
          if(row.hasAttribute('data-open-c')) openRecord('c', row.getAttribute('data-open-c'), false);
          else openRecord('t', row.getAttribute('data-open-t'), false);
          row.scrollIntoView({ block: 'nearest' });
        } else { row.focus(); row.scrollIntoView({ block: 'nearest' }); }
        return;
      }
    }
    if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('tr.rlink')){
      e.preventDefault();
      var r = e.target;
      if(r.hasAttribute('data-open-c')) openRecord('c', r.getAttribute('data-open-c'), false);
      else if(r.hasAttribute('data-open-t')) openRecord('t', r.getAttribute('data-open-t'), false);
      return;
    }
    if(e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
    var box = document.getElementById('custSearch') || document.getElementById('tickSearch');
    if(box){ e.preventDefault(); box.focus(); box.select(); }
  });

  window.addEventListener('hashchange', route);
}

/* ============================== fallback state ============================== */
function showFallback(reason){
  var app = document.getElementById('app');
  mounted = 'fallback';
  app.innerHTML = '' +
  '<div class="fallback"><div class="fb-card">' +
    '<div class="fb-ico">' + svg('quality') + '</div>' +
    '<h1>No tenant data loaded</h1>' +
    '<p>This CRM reads its records at runtime from <code>data.json</code> in the same folder as this page. That file could not be loaded, so there is nothing to display yet.</p>' +
    '<div class="fb-err">' + esc(reason || 'Unknown error') + '</div>' +
    '<ul>' +
      '<li><code>data.json</code> must sit next to this HTML file.</li>' +
      '<li>It must be valid JSON with <code>brand</code>, <code>customers</code>, <code>tickets</code> and <code>issues</code> keys.</li>' +
      '<li>Serve the folder over HTTP. Browsers block <code>fetch()</code> on <code>file://</code> URLs. From this folder run <code>python3 -m http.server 8000</code> and open <code>http://localhost:8000/</code>.</li>' +
    '</ul>' +
    '<button class="btn btn-accent" data-retry="1">Retry</button>' +
  '</div></div>';
}

/* ============================== boot ============================== */
function applyBrand(){
  var root = document.documentElement;
  var rgb = hexToRgb(DATA.brand.accent);
  if(!rgb) rgb = [61, 85, 255];
  /* Derive the declaration from the PARSED value. Writing the original string
     back meant an input like "ff0000" -- which hexToRgb accepts, since the
     leading # is optional -- produced a correct --accent-rgb beside an
     --accent that is not a legal CSS colour, so the two disagreed. */
  var accent = '#' + rgb.map(function(n){
    return (n < 16 ? '0' : '') + n.toString(16);
  }).join('');
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-rgb', rgb.join(','));
  var lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
  root.style.setProperty('--on-accent', lum > 0.62 ? '#0a0c11' : '#ffffff');
  applyTheme(DATA.theme);
  document.title = DATA.brand.name + ' CRM';
}
/* Fine-grained tokens from the config.
   *
   * Defence in depth: the supervisor already validates and REBUILDS every
   * value, so nothing typed by anyone reaches here intact. This checks again
   * anyway, because a CSS custom property value is an injection site -- a
   * value carrying ; or } escapes its declaration and restyles the page -- and
   * this file is served from a public URL.
   *
   * Unknown names are ignored rather than passed through: setProperty on an
   * arbitrary string is how a whitelist stops being one. */
  var THEME_OK = {
    'bg':1,'bg2':1,'surface':1,'surface2':1,'surface3':1,'border':1,'border2':1,
    'text':1,'text-dim':1,'text-faint':1,'green':1,'amber':1,'red':1,'blue':1,
    'violet':1,'radius':1,'sans':1,'mono':1
  };
  var SAFE_VALUE = /^[#\w .,"'()%-]+$/;

  function applyTheme(theme){
    if(!theme || typeof theme !== 'object') return;
    var root = document.documentElement;
    Object.keys(theme).forEach(function(k){
      if(!THEME_OK[k]) return;
      var v = String(theme[k]);
      if(v.length > 200 || !SAFE_VALUE.test(v)) return;
      root.style.setProperty('--' + k, v);
    });
  }

function init(raw){
  DATA = prep(raw);
  applyBrand();
  /* null, so render() rebuilds the shell. The nav, the page titles and the
     table columns all come from the config now, and none of them can change
     while `mounted` still says 'shell'. */
  mounted = null;
  state.cust.per = tablePer('customers');
  state.tick.per = tablePer('tickets');
  route();
}

/* Pick up a republish without a refresh.
 *
 * The supervisor rewrites data.json when the visitor asks for a change --
 * "make it purple and call it Desert Broadband" -- and the beat only lands if
 * the page they are holding changes while they watch. Compared as raw text: one
 * string compare against a file we just fetched anyway, and re-initialising is
 * only worth doing when something actually differs. */
var lastRaw = null;
function pollConfig(){
  fetch('./data.json', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(txt){
      if(!txt || txt === lastRaw) return;
      var parsed;
      try { parsed = JSON.parse(txt); } catch(e){ return; }
      if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return;
      lastRaw = txt;
      init(parsed);
    })
    .catch(function(){ /* a stale tenant beats a blank one */ });
}
function boot(){
  wireEvents();
  setInterval(pollConfig, 4000);
  fetch('./data.json', {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (r.statusText || '') + ' — GET ./data.json');
      return r.text();
    })
    .then(function(txt){
      var parsed;
      try { parsed = JSON.parse(txt); }
      catch(err){ throw new Error('data.json is not valid JSON — ' + err.message); }
      if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){
        throw new Error('data.json did not contain a JSON object at the top level.');
      }
      lastRaw = txt;
        try { init(parsed); }
      catch(err){
        if(window.console && console.error) console.error(err);
        throw new Error('data.json loaded, but rendering failed — ' + (err && err.message ? err.message : String(err)));
      }
    })
    .catch(function(err){
      if(window.console && console.error) console.error(err);
      showFallback(err && err.message ? err.message : String(err));
    });
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
/* Published for tests/browser/tenant.mjs. The app never reads these -- it uses
   the closure bindings directly -- but a renderer that cannot be called in
   isolation cannot be tested in isolation. */
/* Published for tests/browser/tenant.mjs. DATA is a closure variable, so
   swapping it has to happen in here -- which is also the honest thing to
   exercise, because it is exactly what a republish does. */
window.EIOSTenant = {
  panelsHTML: panelsHTML, panelBody: panelBody, prep: prep,
  navItems: navItems, visibleCols: visibleCols,
  applyConfig: function(obj, page){
    /* Goes through init(), the same path boot and the live poll use. An earlier
       version re-prepped and called render() directly, which left `mounted` set
       to 'shell' so the nav was never rebuilt -- a page rename would have
       stayed invisible until a full reload, on a visitor's phone as much as in
       a test. */
    init(obj);
    /* After init, not before: init() calls route(), which reads the URL hash
       and would overwrite it. */
    if(page){ state.page = page; render(); }
    return DATA;
  }
};
})();
</script>
